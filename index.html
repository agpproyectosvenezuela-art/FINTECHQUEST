"use strict";
/* ============================================================
   Interfaz · Defensa SMART (mundos 9 a 12)
   ============================================================ */
let G = null;
const TU = { timer: null, last: 0, sel: 0, els: {}, msgT: null, fx: 0 };
const CARD_H = TD_HMAX;

function tdIntro(n) {
  const cfg = tdConfig(n), info = cfg.info, W = WORLDS[info.w];
  const tut = !S.seen.td ? '<div class="tip">👆 <b>Cómo jugar:</b> lee la meta que baja y piensa <b>qué letra le falta</b>. Toca esa letra para disparar tu torre. Si quieres, toca primero una meta para elegirla. La lupa 🔍 te muestra sus piezas.</div>' : "";
  const rows = ['<div class="goal" style="font-size:16px;border-radius:14px">🔧 Convierte <b>' + cfg.needed + '</b> metas normales en SMART</div>'];
  if (cfg.allies) rows.push('<div class="goal" style="font-size:16px;border-radius:14px">🛡️ Viajan <b>' + cfg.allies + '</b> metas que ya son SMART: ¡no les dispares!</div>');
  else rows.push('<div class="goal" style="font-size:16px;border-radius:14px">❤️ Tienes <b>' + cfg.hearts + '</b> corazones</div>');
  if (info.boss) rows.push('<div class="goal" style="font-size:16px;border-radius:14px">' + W.bossEmoji + ' Llega el jefe: necesita <b>las 5 letras</b></div>');
  openModal("<h2>" + (info.boss ? W.bossEmoji + " Jefe: " + W.boss : "🏯 Defensa · Nivel " + n) + '</h2><p class="sub">' + W.name + (info.boss ? " · Nivel " + n : "") + "</p>" +
    '<div class="col">' + rows.join("") + "</div>" + tut +
    '<div class="acts"><button class="btn" data-act="tdStart" data-n="' + n + '">¡A defender! ▶</button><button class="btn ghost small" data-act="lesson" data-w="' + info.w + '">📖 Repasar la lección</button></div>');
}

function tdStop() { if (TU.timer) { clearInterval(TU.timer); TU.timer = null; } clearTimeout(TU.msgT); }

function startTD(n) {
  closeModal(true); tdStop();
  const cfg = tdConfig(n), info = cfg.info;
  G = new TD(cfg);
  cur = { s: "td", n, info };
  TU.sel = 0; TU.els = {}; TU.last = Date.now();
  setTheme(info.w); Snd.music(info.w, "play");
  setTop({ back: "exitTD", title: (info.boss ? "Jefe · " : "Nivel ") + n + " · " + WORLDS[info.w].short });
  const btns = LK.map(k => '<button class="tdt" data-act="tdFire" data-l="' + k + '" style="--c:' + LET[k].color + '" aria-label="Disparar ' + LET[k].name + '"><b>' + k + "</b><small>" + LET[k].name + "</small></button>").join("");
  render('<section class="tdw"><div class="tdhud"><div class="tdhearts" id="tdh"></div><div class="tdprog" id="tdp"></div><div class="ener" title="Energía"><span>⚡</span><div class="bar"><i id="tde"></i></div></div></div>' +
    '<div class="tdmsg" id="tdmsg"></div><div class="tdf" id="tdf"><div class="tdfx" id="tdfx"></div><div class="tdbase"><span>🏰 BASE</span></div></div>' +
    '<div class="tdbar">' + btns + '</div>' +
    '<div class="boost"><button class="btn small ghost" data-act="tdPause">⏸ Pausa</button><button class="btn small ghost" id="tdl" data-act="tdLupa">🔍 Lupa ×' + cfg.lupas + "</button></div></section>");
  // separación entre tarjetas según la altura real del campo
  const f = $("#tdf"), H = f ? f.clientHeight : 0;
  if (H > CARD_H + 60) G.travel = H - CARD_H - 22;
  tdHud();
  TU.timer = setInterval(() => tdTick(), 50);
}

/* ---------- bucle ---------- */
function tdTick(dtForce) {
  if (!G || cur.s !== "td") { tdStop(); return; }
  const now = Date.now();
  let dt = dtForce !== undefined ? dtForce : (now - TU.last) / 1000;
  TU.last = now;
  if (MODAL || document.hidden) return;
  dt = Math.min(dt, 0.12);
  if (dt <= 0) return;
  G.step(dt);
  G.drain().forEach(tdEvent);
  tdPos(); tdHud();
}

function tdCard(en) {
  const sp = en.spec, d = document.createElement("div");
  d.className = "en" + (sp.kind === "boss" ? " boss" : "") + (sp.elite ? " elite" : "");
  d.dataset.id = en.id; d.dataset.act = "tdSel"; d.style.height = sp.h + "px";
  d.innerHTML = (sp.kind === "boss" ? '<div class="bn">' + WORLDS[cur.info.w].bossEmoji + " " + WORLDS[cur.info.w].boss + "</div>" : "") +
    '<p class="et">' + esc(sp.text) + '</p><div class="eb"></div>';
  return d;
}
function tdPos() {
  const nx = !TU.sel || !G.find(TU.sel) ? G.closest() : null;
  G.en.forEach(en => {
    const el = TU.els[en.id]; if (!el) return;
    el.style.setProperty("--y", en.y.toFixed(4));
    const on = !!nx && nx.id === en.id;
    if (el._nx !== on) { el._nx = on; el.classList.toggle("nx", on); }
  });
}
function tdHud() {
  const h = $("#tdh"); if (!h) return;
  h.textContent = "❤️".repeat(G.hearts) + "🖤".repeat(G.cfg.hearts - G.hearts);
  const done = G.st.conv + G.st.saved + G.st.allyHits + G.st.leaks;
  $("#tdp").innerHTML = "<b>" + done + "</b>/" + G.total() + " metas";
  $("#tde").style.width = Math.round(G.e / G.cfg.emax * 100) + "%";
  document.querySelectorAll(".tdt").forEach(b => b.classList.toggle("dim", G.e < 1));
  const l = $("#tdl"); if (l) { l.textContent = "🔍 Lupa ×" + G.lupas; l.classList.toggle("off", G.lupas <= 0); }
}
function tdMsg(html, cls, ms) {
  const m = $("#tdmsg"); if (!m) return;
  m.className = "tdmsg on " + (cls || ""); m.innerHTML = html;
  clearTimeout(TU.msgT); TU.msgT = setTimeout(() => { const mm = $("#tdmsg"); if (mm) { mm.className = "tdmsg"; mm.innerHTML = ""; } }, ms || 4800);
}
function tdFx(cls, html, left, topY) {
  const fx = $("#tdfx"); if (!fx) return;
  const d = document.createElement("div"); d.className = "fxp " + cls; d.innerHTML = html;
  if (left !== undefined) d.style.left = left; if (topY !== undefined) d.style.top = topY;
  fx.appendChild(d); setTimeout(() => d.remove(), 900);
}
function tdRemove(id, cls, ms) {
  const el = TU.els[id]; if (!el) return;
  delete TU.els[id];
  if (TU.sel === id) TU.sel = 0;
  el.classList.add(cls);
  setTimeout(() => el.remove(), ms || 700);
}
function tdShot(L, en) {
  const i = LK.indexOf(L), fx = $("#tdfx"); if (!fx || !en) return;
  const p = document.createElement("div");
  p.className = "proj"; p.textContent = L;
  p.style.setProperty("--sx", (10 + i * 20) + "%"); p.style.setProperty("--c", LET[L].color);
  p.style.setProperty("--ey", "calc(" + en.y.toFixed(3) + " * (100% - " + (CARD_H + 22) + "px) + " + (CARD_H / 2) + "px)");
  fx.appendChild(p); setTimeout(() => p.remove(), 380);
}

function tdEvent(ev) {
  const en = G.find(ev.id) || null;
  switch (ev.t) {
    case "spawn": {
      const e = G.find(ev.id), el = tdCard(e);
      $("#tdf").appendChild(el); TU.els[ev.id] = el; el.style.setProperty("--y", "0");
      if (e.spec.kind === "boss") { Snd.sfx.unlock(); banner(WORLDS[cur.info.w].bossEmoji + " ¡Llega " + WORLDS[cur.info.w].boss + "!"); }
      break;
    }
    case "hit": {
      const el = TU.els[ev.id];
      if (el) {
        const b = document.createElement("span"); b.className = "bd"; b.style.setProperty("--c", LET[ev.L].color); b.textContent = ev.L;
        $(".eb", el).appendChild(b);
        el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 260);
      }
      tdShot(ev.L, G.find(ev.id) || { y: 0.5 });
      Snd.sfx.letter();
      break;
    }
    case "conv": {
      const el = TU.els[ev.id];
      if (el) { const t = $(".et", el); }
      Snd.sfx.ok();
      tdMsg("✅ <b>¡Ahora es SMART!</b> Ya tiene las 5 letras.", "ok", 2400);
      if (ev.boss) { Snd.sfx.boom(); banner("¡Jefe convertido!"); }
      tdRemove(ev.id, "conv", 800);
      break;
    }
    case "wrong": {
      const el = TU.els[ev.id];
      if (el) { el.classList.add("shk"); setTimeout(() => el.classList.remove("shk"), 420); }
      tdShot(ev.L, G.find(ev.id) || { y: 0.5 });
      Snd.sfx.bad();
      tdMsg("❌ <b>Letra equivocada.</b> " + esc(ev.why), "bad", 6200);
      break;
    }
    case "allyhit": {
      Snd.sfx.no();
      tdMsg("💔 <b>¡Esa meta ya era SMART!</b> Tenía las 5 letras. Las metas SMART se dejan pasar.", "bad", 6200);
      tdRemove(ev.id, "gone", 600);
      break;
    }
    case "leak": {
      Snd.sfx.no();
      const el = TU.els[ev.id];
      const sp = cfgSpec(ev.id);
      const miss = sp ? sp.need.map(k => k + " (" + LET[k].name + ")").join(", ") : "";
      tdMsg("💥 <b>¡Una meta normal llegó a la base!</b> Le faltaba: " + esc(miss) + ".", "bad", 6500);
      tdRemove(ev.id, "gone", 500);
      break;
    }
    case "saved": {
      Snd.sfx.star(0);
      tdMsg("🛡️ <b>¡Meta SMART a salvo!</b> +2 de energía ⚡", "ok", 2600);
      tdRemove(ev.id, "conv", 700);
      break;
    }
    case "noenergy": tdMsg("⚡ Sin energía. ¡Espera un momento!", "bad", 1600); Snd.sfx.bad(); break;
    case "over": tdOver(ev.r); break;
  }
}
function cfgSpec(id) { return G.cfg.seq.find(s => s.id === id) || null; }

/* ---------- acciones ---------- */
function tdFire(L) {
  if (!G || G.over || MODAL) return;
  let id = TU.sel && G.find(TU.sel) ? TU.sel : 0;
  if (!G.closest()) return;
  G.fire(L, id || undefined);
  G.drain().forEach(tdEvent);
  tdPos(); tdHud();
}
function tdSel(id) {
  if (!G || G.over || MODAL) return;
  TU.sel = TU.sel === id ? 0 : id;
  document.querySelectorAll(".en").forEach(e => e.classList.toggle("sel", +e.dataset.id === TU.sel));
  Snd.sfx.select();
}
function tdLupa() {
  if (!G || G.over || MODAL) return;
  if (G.lupas <= 0) { toast("🔍 Ya no te quedan lupas"); Snd.sfx.bad(); return; }
  const x = (TU.sel && G.find(TU.sel)) || G.closest();
  if (!x) { toast("Todavía no hay metas en pantalla"); return; }
  G.lupas--; tdHud(); Snd.sfx.hint();
  const sp = x.spec;
  const chips = tdLupaChips(x).map(c => {
    const L = LET[c.k];
    return '<div class="chip ' + c.st + '" style="--c:' + L.color + '"><b>' + c.k + "</b><span>" + esc(c.t) + "</span></div>";
  }).join("");
  const verdict = sp.kind === "ally" ? "🛡️ ¡Ya es una meta SMART! No le dispares." : sp.vk === "vague" ? "Es solo un deseo: necesita las 5 letras." : "Todavía no es SMART: dispara las letras que faltan.";
  openModal("<h2>🔍 Lupa</h2>" + stmtHTML(sp.text) + '<div class="bk">' + chips + '</div><div class="fact">' + verdict + '</div><div class="acts"><button class="btn" data-act="closeModal">Seguir jugando ▶</button></div>');
}
const stmtHTML = t => '<div class="stmt">' + esc(t) + "</div>";
function tdPause() {
  if (!G || G.over || MODAL) return;
  openModal('<h2>⏸ Pausa</h2><p class="sub">El juego espera por ti.</p><div class="acts"><button class="btn green" data-act="closeModal">Seguir ▶</button><button class="btn ghost small" data-act="exitTDnow">🗺️ Salir al mapa</button></div>', { dismiss: false });
}

/* ---------- fin ---------- */
function tdOver(r) {
  tdStop();
  const n = G.cfg.n, info = G.cfg.info, W = WORLDS[info.w];
  setTimeout(() => {
    if (r === "lose") {
      Snd.sfx.lose();
      openModal("<h2>😮 ¡La base cayó!</h2><p class='sub'>Se colaron demasiadas metas. ¡Inténtalo otra vez!</p>" +
        '<div class="fact">Recuerda: lee la meta, busca <b>qué letra le falta</b> y no le dispares a las que ya son SMART.</div>' +
        '<div class="acts"><button class="btn" data-act="retry" data-n="' + n + '">🔁 Reintentar</button><button class="btn ghost" data-act="exitToLevels">🗺️ Volver al mapa</button></div>', { dismiss: false });
      return;
    }
    const stars = G.stars(), prev = starsOf(n);
    S.stars[n] = Math.max(prev, stars); save();
    const first = prev === 0;
    let extra = "";
    if (info.boss && first && n < MAXLV) extra = '<div class="fact">🎉 ¡Derrotaste a ' + W.boss + " y desbloqueaste <b>" + WORLDS[info.w + 1].name + "</b>!</div>";
    Snd.sfx.win();
    const last = n === MAXLV;
    openModal("<h2>" + (info.boss ? W.bossEmoji + " ¡Jefe derrotado!" : "¡Defensa lograda!") + '</h2><p class="sub">' + levelTitle(n) + "</p>" +
      '<div class="starsbig"><span>★</span><span>★</span><span>★</span></div>' +
      '<div class="sum"><div><b>' + G.st.conv + '</b><small>metas convertidas</small></div><div><b>' + G.st.saved + '</b><small>SMART a salvo</small></div><div><b>' + G.lost + '</b><small>corazones perdidos</small></div></div>' +
      (stars < 3 ? '<p class="muted" style="text-align:center;margin:0;font-size:14px">3 ⭐ = máximo 1 corazón perdido y máximo 2 disparos equivocados.</p>' : "") +
      extra + '<div class="fact">' + FACTS[n % FACTS.length] + "</div>" +
      '<div class="acts">' + (last ? '<button class="btn green" data-act="final">🏆 Ver mi diploma</button>' : '<button class="btn green" data-act="openNext" data-n="' + (n + 1) + '">' + (info.boss ? "Siguiente mundo ▶" : "Siguiente nivel ▶") + "</button>") +
      '<div class="row"><button class="btn ghost small" data-act="retry" data-n="' + n + '">🔁 Repetir</button><button class="btn ghost small" data-act="exitToLevels">🗺️ Mapa</button></div></div>', { dismiss: false });
    for (let i = 0; i < stars; i++) setTimeout(() => {
      const el = document.querySelectorAll(".starsbig span")[i]; if (el) { el.classList.add("on"); Snd.sfx.star(i); }
    }, 350 + i * 420);
    if (info.boss && first && n < MAXLV) setTimeout(() => Snd.sfx.unlock(), 1700);
  }, 700);
}

"use strict";
/* ============================================================
   Interfaz · retos SMART, resultados, acciones y arranque
   ============================================================ */
let CH = null;
const TYPE_LABEL = {
  tf: "Verdadero o falso", classify: "Meta normal o SMART", findSmart: "Encuentra la meta SMART", missing: "Detective de metas",
  whichLetter: "¿Qué letra es?", tap: "Toca la parte correcta", compare: "Compara dos metas", yesno: "Sí o no", taskres: "Tarea o resultado",
  build: "Forja de metas", match: "Une las parejas", order: "Ordena los pasos", hangman: "Ahorcado SMART"
};
const PRAISE = ["¡Correcto!", "¡Muy bien!", "¡Excelente!", "¡Eso es!", "¡Genial!", "¡Bien pensado!"];
const KEYS = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

function startChallenge(n) {
  closeModal(true);
  const info = lvInfo(n);
  const earned = B ? 1 + Math.min(3, Math.floor(B.totalCleared / 20)) : 1;
  CH = { n, info, qs: makeChallenge(n), i: 0, mistakes: 0, hints: earned, usedHints: 0, done: false, st: {}, movesLeft: B ? B.moves : 0, movesTotal: B ? B.cfg.moves : 1 };
  cur = { s: "chal", n, info };
  clearTimeout(UI.idleT);
  setTheme(info.w); Snd.music(info.w, "think");
  setTop({ back: "exitChal", title: (info.boss ? "Jefe · " : "Nivel ") + n + " · Reto SMART" });
  renderQuestion();
}

function choiceHTML(q) {
  const cls = "opts" + (q.row ? " r1" : "") + (q.grid ? " g2" : "");
  return (q.stem || "") + '<div class="' + cls + '">' + q.opts.map(o => {
    let inner;
    if (o.color) { const p = o.label.split(" · "); inner = '<span class="ob">' + p[0] + "</span><span>" + esc(p[1]) + "</span>"; } else inner = esc(o.label);
    return '<button class="opt' + (o.label.length > 60 ? " long" : "") + '" data-act="opt" data-id="' + esc(o.id) + '"' + (o.color ? ' style="--oc:' + o.color + '"' : "") + ">" + inner + "</button>";
  }).join("") + "</div>";
}
function tapHTML(q) {
  return '<div class="segs">' + q.segs.map((s, i) => '<button class="seg" data-act="seg" data-i="' + i + '">' + esc(s.t) + (i < q.segs.length - 1 ? "," : ".") + "</button>").join("") + "</div>";
}
function buildHTML(q) {
  return '<div class="stmt">📝 Meta normal: «' + esc(q.vague.replace(/\.$/, "")) + '»</div><div class="preview" id="pv"></div><div class="col" id="slots">' +
    q.slots.map(s => {
      const L = LET[s.k];
      return '<div class="slot' + (s.fixed ? " fixed" : "") + '" data-k="' + s.k + '" style="--c:' + L.color + '"><div class="sh2"><b>' + s.k + "</b><span>" + L.name + " · " + L.key + '</span></div><div class="ch">' +
        (s.fixed ? '<div class="pc pick">' + esc(s.t) + "</div>" : s.opts.map((o, j) => '<button class="pc" data-act="pick" data-k="' + s.k + '" data-j="' + j + '">' + esc(o.t) + "</button>").join("")) + "</div></div>";
    }).join("") + '</div><button class="btn green" id="forge" data-act="forge" disabled>⚒️ ¡Forjar meta!</button>';
}
function matchHTML(q) {
  CH.st.sel = null; CH.st.done = 0;
  const right = shuf(q.pairs.map((p, i) => i));
  return '<div class="mgrid"><div class="col">' + q.pairs.map((p, i) => '<button class="mi" data-act="mi" data-side="l" data-i="' + i + '">' + esc(p[0]) + "</button>").join("") +
    '</div><div class="col">' + right.map(j => '<button class="mi" data-act="mi" data-side="r" data-j="' + j + '">' + esc(q.pairs[j][1]) + "</button>").join("") + "</div></div>";
}
function orderHTML(q) {
  CH.st.next = 0;
  const idx = shuf(q.items.map((_, i) => i));
  if (idx.every((v, i) => v === i)) idx.reverse();
  return '<div class="ord">' + q.items.map((_, i) => '<div class="oslot" id="os' + i + '"><b>' + (i + 1) + "</b><span></span></div>").join("") + '</div><div class="opool">' +
    idx.map(j => '<button class="pc" data-act="ord" data-j="' + j + '">' + esc(q.items[j]) + "</button>").join("") + "</div>";
}
function hmHTML() { CH.st.g = new Set(); CH.st.err = 0; return '<div id="hm"></div>'; }
function hmDraw() {
  const q = CH.q, s = CH.st, w = q.word.split("");
  const el = $("#hm"); if (!el) return;
  el.innerHTML = '<div class="hearts" aria-label="Vidas">' + "❤️".repeat(6 - s.err) + "🖤".repeat(s.err) + '</div><div class="word" style="margin:12px 0">' +
    w.map(ch => "<span>" + (s.g.has(ch) || CH.done ? ch : "") + "</span>").join("") + '</div><div class="clue">💬 ' + esc(q.clue) + '</div><div class="kb" style="margin-top:12px">' +
    KEYS.map(k => '<button class="key' + (s.g.has(k) ? (w.includes(k) ? " hit" : " miss") : "") + '" data-act="key" data-l="' + k + '">' + k + "</button>").join("") + "</div>";
}

function renderQuestion() {
  const q = CH.qs[CH.i]; CH.q = q; CH.done = false; CH.st = {};
  const W = WORLDS[CH.info.w];
  const dots = CH.qs.map((_, i) => '<i class="' + (i < CH.i ? "on" : i === CH.i ? "cur" : "") + '"></i>').join("");
  let body = "";
  switch (q.kind) {
    case "choice": body = choiceHTML(q); break;
    case "tap": body = tapHTML(q); break;
    case "build": CH.st.pick = {}; body = buildHTML(q); break;
    case "match": body = matchHTML(q); break;
    case "order": body = orderHTML(q); break;
    case "hangman": body = hmHTML(); break;
  }
  render('<section class="chal"><div class="chead' + (CH.info.boss ? " boss" : "") + '" id="chead"><span class="mo">' + (CH.info.boss ? W.bossEmoji : W.emoji) + '</span><div class="mid"><div class="nm">' +
    (CH.info.boss ? "Jefe: " + W.boss + " · " + (CH.i + 1) + "/" + CH.qs.length : "Pregunta " + (CH.i + 1) + " de " + CH.qs.length) + '</div><div class="dots">' + dots + "</div></div></div>" +
    '<div class="card q"><div class="qtop"><span class="qtype">' + TYPE_LABEL[q.type] + '</span><button class="mini" data-act="speak" aria-label="Leer en voz alta">🔊</button></div><h2 class="prompt">' + esc(q.prompt) + "</h2>" + body + "</div>" +
    '<div id="fb"></div><div class="chbar"><button class="btn ghost small" id="hintBtn" data-act="hint">💡 Pista ×' + CH.hints + "</button></div></section>");
  if (q.kind === "build") updatePreview();
  if (q.kind === "hangman") hmDraw();
}

/* ---------- comentarios ---------- */
const isLast = () => CH.i + 1 >= CH.qs.length;
function fbOk(msg, html) {
  CH.done = true;
  const hb = $("#hintBtn"); if (hb) hb.classList.add("hidden");
  $("#fb").innerHTML = '<div class="fb ok fade"><h3>' + PRAISE[Math.floor(Math.random() * PRAISE.length)] + "</h3><p>" + esc(msg || "") + "</p>" + (html || "") +
    '<button class="btn green" data-act="next">' + (isLast() ? "Terminar reto ▶" : "Siguiente ▶") + "</button></div>";
  const f = $("#fb"); if (f && f.scrollIntoView) f.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function fbNo(msg) {
  $("#fb").innerHTML = '<div class="fb no fade"><h3>Casi…</h3><p>' + esc(msg) + "</p></div>";
  const f = $("#fb"); if (f && f.scrollIntoView) f.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function fbEnd(msg) {
  CH.done = true;
  const hb = $("#hintBtn"); if (hb) hb.classList.add("hidden");
  $("#fb").innerHTML = '<div class="fb no fade"><h3>¡Casi!</h3><p>' + msg + '</p><button class="btn" data-act="next">' + (isLast() ? "Terminar reto ▶" : "Siguiente ▶") + "</button></div>";
}

/* ---------- respuestas ---------- */
function answerChoice(el) {
  if (CH.done) return;
  const q = CH.q, id = el.dataset.id;
  if (id === q.correct) {
    el.classList.add("right");
    document.querySelectorAll(".opt").forEach(o => { if (o !== el && !o.classList.contains("wrong")) o.classList.add("gone"); });
    Snd.sfx.ok(); fbOk(q.explain, q.explainHTML);
  } else {
    el.classList.add("wrong"); CH.mistakes++; Snd.sfx.no();
    fbNo((q.why && q.why[id]) || "Piénsalo otra vez. ¡Tú puedes!");
  }
}
function answerSeg(el) {
  if (CH.done) return;
  const q = CH.q, i = +el.dataset.i, s = q.segs[i];
  if (s.k === q.target) {
    document.querySelectorAll(".seg").forEach((b, j) => {
      const sg = q.segs[j];
      if (sg.k) b.insertAdjacentHTML("afterbegin", '<span class="sl" style="--c:' + LET[sg.k].color + '">' + sg.k + "</span>");
      if (j === i) b.classList.add("right");
    });
    Snd.sfx.ok(); fbOk(q.explain);
  } else {
    el.classList.add("wrong"); CH.mistakes++; Snd.sfx.no();
    fbNo(s.k ? "Esa parte es la " + s.k + " (" + LET[s.k].name + "). Busca la que responde: " + LET[q.target].key : "Esa no es. ¡Sigue buscando!");
    setTimeout(() => el.classList.remove("wrong"), 700);
  }
}
function updatePreview() {
  const q = CH.q, parts = q.slots.map(s => {
    const L = LET[s.k];
    if (s.fixed) return '<span class="pv" style="--c:' + L.color + '">' + esc(s.t) + "</span>";
    const j = CH.st.pick[s.k];
    return j === undefined ? '<span class="pe">…(' + s.k + ")…</span>" : '<span class="pv" style="--c:' + L.color + '">' + esc(s.opts[j].t) + "</span>";
  });
  const pv = $("#pv"); if (pv) pv.innerHTML = parts.join(", ") + ".";
  const all = q.slots.every(s => s.fixed || CH.st.pick[s.k] !== undefined);
  const fg = $("#forge"); if (fg) fg.disabled = !all || CH.done;
}
function pickChip(k, j) {
  if (CH.done) return;
  CH.st.pick[k] = j;
  const slot = document.querySelector('.slot[data-k="' + k + '"]');
  slot.classList.remove("bad");
  slot.querySelectorAll(".pc").forEach((b, x) => b.classList.toggle("pick", x === j));
  slot.style.setProperty("--c", LET[k].color);
  Snd.sfx.select(); updatePreview();
}
function forge() {
  if (CH.done) return;
  const q = CH.q; let bad = 0;
  q.slots.forEach(s => {
    if (s.fixed) return;
    const slot = document.querySelector('.slot[data-k="' + s.k + '"]');
    const ok = s.opts[CH.st.pick[s.k]].ok;
    slot.classList.toggle("bad", !ok); slot.classList.toggle("okk", !!ok);
    if (!ok) bad++;
  });
  if (bad) { CH.mistakes++; Snd.sfx.no(); fbNo("Revisa las piezas marcadas en rojo. Pregúntate: " + q.slots.filter(s => !s.fixed && !s.opts[CH.st.pick[s.k]].ok).map(s => "«" + LET[s.k].key + "»").join(" · ")); }
  else {
    document.querySelectorAll("#slots .pc").forEach(b => { b.disabled = true; });
    Snd.sfx.ok(); fbOk(q.explain + " Tu meta SMART quedó así: " + q.slots.map(s => s.fixed ? s.t : s.opts[CH.st.pick[s.k]].t).join(", ") + ".");
  }
}
function matchClick(el) {
  if (CH.done) return;
  const q = CH.q;
  if (el.dataset.side === "l") {
    document.querySelectorAll('.mi[data-side="l"]').forEach(x => x.classList.remove("sel"));
    CH.st.sel = el.dataset.i; el.classList.add("sel"); Snd.sfx.select(); return;
  }
  if (CH.st.sel === null || CH.st.sel === undefined) { toast("Primero toca una carta de la izquierda"); return; }
  const i = CH.st.sel, left = document.querySelector('.mi[data-side="l"][data-i="' + i + '"]');
  CH.st.sel = null; left.classList.remove("sel");
  if (i === el.dataset.j) { markPair(left, el); }
  else {
    CH.mistakes++; Snd.sfx.no(); el.classList.add("wrong"); left.classList.add("wrong");
    setTimeout(() => { el.classList.remove("wrong"); left.classList.remove("wrong"); }, 450);
    fbNo("Esas dos no van juntas. ¡Prueba otra pareja!");
  }
}
function markPair(left, right) {
  left.classList.add("done"); right.classList.add("done"); CH.st.done++; Snd.sfx.match(CH.st.done);
  $("#fb").innerHTML = "";
  if (CH.st.done === CH.q.pairs.length) { Snd.sfx.ok(); fbOk(CH.q.explain); }
}
function orderPlace(j, btn) {
  if (CH.done) return;
  const q = CH.q;
  if (j === CH.st.next) {
    const slot = $("#os" + j);
    slot.querySelector("span").textContent = q.items[j]; slot.classList.add("full");
    btn.style.visibility = "hidden"; btn.disabled = true; CH.st.next++; Snd.sfx.match(CH.st.next);
    $("#fb").innerHTML = "";
    if (CH.st.next === q.items.length) { Snd.sfx.ok(); fbOk(q.explain); }
  } else {
    CH.mistakes++; Snd.sfx.no(); btn.classList.add("shk"); setTimeout(() => btn.classList.remove("shk"), 400);
    fbNo("Ese paso no va ahora. ¿Qué pasa primero?");
  }
}
function hmKey(l, fromHint) {
  if (CH.done) return;
  const q = CH.q, s = CH.st;
  if (s.g.has(l)) return;
  s.g.add(l);
  if (q.word.includes(l)) {
    Snd.sfx.letter();
    if (q.word.split("").every(c => s.g.has(c))) { CH.done = true; hmDraw(); Snd.sfx.ok(); fbOk(q.explain + " ¡Sin perder todas las vidas!"); return; }
  } else {
    s.err++; Snd.sfx.no();
    if (s.err >= 6) { CH.mistakes += 2; CH.done = true; hmDraw(); fbEnd("No pasa nada: la palabra era <b>" + q.word + "</b>. Ya la conoces para la próxima."); return; }
  }
  hmDraw();
}

/* ---------- pistas ---------- */
function useHint() {
  if (!CH || CH.done) return;
  const q = CH.q;
  if (CH.hints <= 0) { toast("No te quedan pistas. ¡Gana más recolectando cristales!"); return; }
  let used = false;
  if (q.kind === "choice") {
    const c = Array.prototype.filter.call(document.querySelectorAll(".opt"), o => o.dataset.id !== q.correct && !o.classList.contains("gone") && !o.classList.contains("wrong"));
    if (c.length) { c[Math.floor(Math.random() * c.length)].classList.add("gone"); used = true; } else toast("Solo queda la respuesta correcta");
  } else if (q.kind === "tap") {
    const el = document.querySelectorAll(".seg")[q.segs.findIndex(s => s.k === q.target)]; el.classList.add("pulse"); used = true;
  } else if (q.kind === "build") {
    const s = q.slots.find(x => !x.fixed && !(CH.st.pick[x.k] !== undefined && x.opts[CH.st.pick[x.k]].ok));
    if (s) { pickChip(s.k, s.opts.findIndex(o => o.ok)); used = true; }
  } else if (q.kind === "match") {
    const left = Array.prototype.find.call(document.querySelectorAll('.mi[data-side="l"]'), b => !b.classList.contains("done"));
    if (left) { const r = document.querySelector('.mi[data-side="r"][data-j="' + left.dataset.i + '"]'); left.classList.remove("sel"); CH.st.sel = null; markPair(left, r); used = true; }
  } else if (q.kind === "order") {
    const b = Array.prototype.find.call(document.querySelectorAll('#screen .opool .pc'), x => +x.dataset.j === CH.st.next);
    if (b) { orderPlace(CH.st.next, b); used = true; }
  } else if (q.kind === "hangman") {
    const l = q.word.split("").find(c => !CH.st.g.has(c)); if (l) { hmKey(l, true); used = true; }
  }
  if (used) { CH.hints--; CH.usedHints++; Snd.sfx.hint(); const hb = $("#hintBtn"); if (hb) hb.textContent = "💡 Pista ×" + CH.hints; }
}
function speechText(q) {
  const strip = h => String(h || "").replace(/<[^>]+>/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
  let t = q.prompt + ". " + strip(q.stem);
  if (q.kind === "choice") t += " " + q.opts.map((o, i) => (q.opts.length > 2 ? "Opción " + "ABCDE"[i] + ": " : "") + o.label.replace(" · ", ", ")).join(". ");
  if (q.kind === "tap") t += " " + q.segs.map(s => s.t).join(", ");
  if (q.kind === "hangman") t += " Pista: " + q.clue;
  if (q.kind === "build") t += " Meta normal: " + q.vague;
  return t;
}

/* ---------- resultado ---------- */
function finishChallenge() {
  const n = CH.n, info = CH.info, m = CH.mistakes;
  let stars = 1; if (m <= 1) stars = 2; if (m === 0 && CH.movesLeft >= Math.ceil(CH.movesTotal * 0.15)) stars = 3;
  const prev = starsOf(n);
  S.stars[n] = Math.max(prev, stars); save();
  const first = prev === 0, W = WORLDS[info.w];
  let extra = "";
  if (info.boss && first && n < MAXLV) { extra = '<div class="fact">🎉 ¡Derrotaste a ' + W.boss + " y desbloqueaste <b>" + WORLDS[info.w + 1].name + "</b>!</div>"; }
  Snd.sfx.win();
  const lastLevel = n === MAXLV;
  openModal("<h2>" + (info.boss ? W.bossEmoji + " ¡Jefe derrotado!" : "¡Nivel completado!") + '</h2><p class="sub">' + levelTitle(n) + "</p>" +
    '<div class="starsbig"><span>★</span><span>★</span><span>★</span></div>' +
    '<div class="sum"><div><b>' + m + '</b><small>errores</small></div><div><b>' + CH.usedHints + '</b><small>pistas usadas</small></div><div><b>' + CH.movesLeft + '</b><small>jugadas sobrantes</small></div></div>' +
    (stars < 3 ? '<p class="muted" style="text-align:center;margin:0;font-size:14px">' + (m > 0 ? "3 ⭐ = cero errores y jugadas de sobra." : "Para 3 ⭐ termina los cristales con más jugadas de sobra.") + "</p>" : "") +
    extra + '<div class="fact">' + FACTS[n % FACTS.length] + "</div>" +
    '<div class="acts">' + (lastLevel ? '<button class="btn green" data-act="final">🏆 Ver mi diploma</button>' : '<button class="btn green" data-act="openNext" data-n="' + (n + 1) + '">' + (info.boss ? "Siguiente mundo ▶" : "Siguiente nivel ▶") + "</button>") +
    '<div class="row"><button class="btn ghost small" data-act="retry" data-n="' + n + '">🔁 Repetir</button><button class="btn ghost small" data-act="exitToLevels">🗺️ Mapa</button></div></div>', { dismiss: false });
  for (let i = 0; i < stars; i++) setTimeout(() => {
    const el = document.querySelectorAll(".starsbig span")[i]; if (el) { el.classList.add("on"); Snd.sfx.star(i); }
  }, 350 + i * 420);
  if (info.boss && first && n < MAXLV) setTimeout(() => Snd.sfx.unlock(), 1700);
}

/* ---------- acciones ---------- */
function refreshToggles() {
  document.querySelectorAll('[data-act="tglMusic"]').forEach(b => { if (b.classList.contains("sw")) b.classList.toggle("on", Snd.st.music); else b.classList.toggle("off", !Snd.st.music); });
  document.querySelectorAll('[data-act="tglSfx"]').forEach(b => { if (b.classList.contains("sw")) b.classList.toggle("on", Snd.st.sfx); else b.classList.toggle("off", !Snd.st.sfx); });
}
const ACT = {
  title() { screenTitle(); },
  play() { openLevel(Math.min(MAXLV, maxDone() + 1)); },
  worlds() { closeModal(true); screenWorlds(); },
  openWorld(el) {
    const w = +el.dataset.w;
    if (w * 25 + 1 > unlockedMax()) { toast("🔒 Termina el mundo anterior para entrar"); Snd.sfx.bad(); return; }
    screenLevels(w);
  },
  level(el) { const n = +el.dataset.n; if (n > unlockedMax()) return; openLevel(n); },
  lesson(el) { lessonModal(+el.dataset.w); },
  lessonNext() { LS.i++; drawLesson(); },
  lessonPrev() { LS.i--; drawLesson(); },
  lessonDone() { const a = LS.after; closeModal(true); if (a) a(); },
  book() { bookModal(); },
  settings() { settingsModal(); },
  closeModal() { closeModal(); },
  confirmYes() { const f = CONF; CONF = null; if (f) f(); },
  saveName() {
    const i = $("#nm"), v = i ? i.value.trim() : "";
    if (v) S.name = v.slice(0, 18); else S.seen.skipName = 1;
    save(); screenTitle();
  },
  tglMusic() { Snd.setMusic(!Snd.st.music); S.music = Snd.st.music; save(); refreshToggles(); },
  tglSfx() { Snd.setSfx(!Snd.st.sfx); S.sfx = Snd.st.sfx; save(); refreshToggles(); },
  tglTeacher(el) { S.teacher = !S.teacher; save(); el.classList.toggle("on", S.teacher); toast(S.teacher ? "Modo docente: todos los niveles abiertos" : "Modo docente desactivado"); },
  exp() {
    const c = makeCode(), t = $("#code"); t.value = c; t.select();
    try { navigator.clipboard.writeText(c).then(() => toast("Código copiado"), () => toast("Copia el código del cuadro")); } catch (e) { toast("Copia el código del cuadro"); }
  },
  imp() {
    try {
      const o = readCode($("#code").value);
      for (const k in o.stars) S.stars[k] = Math.max(S.stars[k] || 0, o.stars[k]);
      if (o.name) S.name = o.name;
      save(); toast("¡Partida cargada! ⭐ " + totalStars());
    } catch (e) { toast("Ese código no es válido"); }
  },
  reset() { confirmModal("Se borrarán todas tus estrellas y niveles.", "Sí, borrar", () => { S.stars = {}; S.seen = {}; save(); closeModal(true); screenTitle(); toast("Progreso borrado"); }); },
  startBoard(el) { startBoard(+el.dataset.n); },
  toChallenge() { startChallenge(cur.n); },
  retry(el) { const n = +(el.dataset.n || cur.n); if (lvInfo(n).w >= TD_FIRST) startTD(n); else startBoard(n); },
  tdStart(el) { startTD(+el.dataset.n); },
  tdFire(el) { tdFire(el.dataset.l); },
  tdSel(el) { tdSel(+el.dataset.id); },
  tdPause() { tdPause(); },
  tdLupa() { tdLupa(); },
  exitTD() { confirmModal("Perderás tu avance en este nivel.", "Salir", () => { tdStop(); closeModal(true); screenLevels(cur.info.w); }); },
  exitTDnow() { tdStop(); closeModal(true); screenLevels(cur.info.w); },
  extra() { B.moves += 5; UI.extraUsed = true; UI.busy = false; closeModal(true); hudFrom(snapshot()); idleReset(); toast("+5 jugadas ¡Vamos!"); },
  exitBoard() { confirmModal("Perderás tu avance en este nivel.", "Salir", () => { closeModal(true); clearTimeout(UI.idleT); screenLevels(cur.info.w); }); },
  exitChal() { confirmModal("Tendrás que repetir el nivel desde los cristales.", "Salir", () => { closeModal(true); screenLevels(cur.info.w); }); },
  exitToLevels() { closeModal(true); screenLevels(cur.info ? cur.info.w : 0); },
  openNext(el) { const n = +el.dataset.n; closeModal(true); screenLevels(lvInfo(n).w); openLevel(n); },
  final() { closeModal(true); finalModal(); },
  hammer() { toggleHammer(); },
  shuf() { doShuffle(); },
  opt(el) { answerChoice(el); },
  seg(el) { answerSeg(el); },
  pick(el) { pickChip(el.dataset.k, +el.dataset.j); },
  forge() { forge(); },
  mi(el) { matchClick(el); },
  ord(el) { orderPlace(+el.dataset.j, el); },
  key(el) { hmKey(el.dataset.l); },
  hint() { useHint(); },
  speak() { if (CH && CH.q) { if (!Snd.speak(speechText(CH.q))) toast("Tu navegador no puede leer en voz alta"); } },
  next() {
    if (!CH || !CH.done) return;
    Snd.stopSpeak();
    if (CH.i + 1 < CH.qs.length) { CH.i++; renderQuestion(); } else finishChallenge();
  }
};
const QUIET = new Set(["opt", "seg", "pick", "forge", "mi", "ord", "key", "hint", "speak", "hammer", "shuf", "next", "tdFire", "tdSel", "tdLupa", "tdPause"]);
function onClick(e) {
  const t = e.target.closest("[data-act]"); if (!t) return;
  Snd.unlock();
  const f = ACT[t.dataset.act]; if (!f) return;
  if (!QUIET.has(t.dataset.act)) Snd.sfx.click();
  f(t, e);
}

/* ---------- arranque ---------- */
function boot() {
  load();
  Snd.st.music = S.music !== false; Snd.st.sfx = S.sfx !== false;
  const sky = $("#sky");
  for (let i = 0; i < 46; i++) {
    const d = document.createElement("i");
    d.style.left = Math.random() * 100 + "%"; d.style.top = Math.random() * 100 + "%";
    d.style.animationDelay = (Math.random() * 3.5).toFixed(2) + "s"; d.style.opacity = (0.2 + Math.random() * 0.5).toFixed(2);
    sky.appendChild(d);
  }
  document.addEventListener("click", onClick);
  $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay" && MODAL && MODAL.dismiss) closeModal(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && MODAL && MODAL.dismiss) closeModal();
    if (e.key === "Enter" && e.target && e.target.id === "nm") ACT.saveName();
  });
  document.addEventListener("visibilitychange", () => Snd.hidden(document.hidden));
  screenTitle();
}

boot();
</script>
