<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SMART Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Concepto: pantalla de juego nocturna; los cristales S M A R T son la fuente de luz.
   Cada mundo cambia el fondo (--g1/--g2) y el brillo (--glow). */
:root {
  --night: #0e1230;
  --ink: #fff6df;
  --muted: #bcc4f0;
  --card: rgba(255, 255, 255, .09);
  --card2: rgba(10, 14, 48, .55);
  --line: rgba(255, 255, 255, .18);
  --gold: #ffd24a;
  --gold2: #ff9a1f;
  --on-gold: #2b1600;
  --good: #35e08a;
  --bad: #ff5d73;
  --warn: #ffb84a;
  --g1: #1c3b8f;
  --g2: #0b1b4d;
  --glow: #4fd1ff;
  --cS: #ff4d6d; --cM: #3b9bff; --cA: #2fd07a; --cR: #ff9a1f; --cT: #b36bff;
  --f-display: "Lilita One", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--night);
  background-image: radial-gradient(1200px 700px at 50% -10%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 70%), linear-gradient(165deg, var(--g1), var(--g2));
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.35;
  -webkit-user-select: none; user-select: none;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 10px; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 28px; min-height: 100dvh; position: relative; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.hidden { display: none !important; }

/* estrellas de fondo */
#sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .5; animation: tw 3.5s infinite ease-in-out; }
@keyframes tw { 50% { opacity: .1; transform: scale(.6); } }
#app > * { position: relative; z-index: 1; }

/* barra superior */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding-block: 6px; }
.topbar .grp { display: flex; gap: 6px; align-items: center; }
.ib { width: 42px; height: 42px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 20px; line-height: 1; }
.ib:active { transform: translateY(1px); }
.ib.off { opacity: .45; }
.crumb { font-family: var(--f-display); font-size: 17px; opacity: .95; text-align: center; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 10px 22px; border-radius: 18px; border: 0; font-family: var(--f-display); font-size: 20px; letter-spacing: .02em;
  background: linear-gradient(180deg, var(--gold), var(--gold2)); color: var(--on-gold); box-shadow: 0 5px 0 #b45f00, 0 10px 18px rgba(0, 0, 0, .35); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b45f00, 0 3px 8px rgba(0, 0, 0, .35); }
.btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
.btn.green { background: linear-gradient(180deg, #5af0a0, #1fb86a); color: #052b17; box-shadow: 0 5px 0 #0c7a43, 0 10px 18px rgba(0, 0, 0, .35); }
.btn.small { min-height: 42px; font-size: 16px; padding: 6px 14px; border-radius: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
.col { display: flex; flex-direction: column; gap: 12px; }

/* tarjetas */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px; backdrop-filter: blur(6px); }
.muted { color: var(--muted); }
.tip { margin: 10px 0 0; padding: 10px 12px; border-radius: 14px; background: rgba(255, 210, 74, .13); border: 1.5px dashed rgba(255, 210, 74, .55); font-size: 15px; }

/* ---------- Gemas ---------- */
.gx { --gc: #888; --clip: circle(48%); }
.gx.g0 { --gc: var(--cS); --clip: polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%); }
.gx.g1 { --gc: var(--cM); --clip: polygon(26% 6%, 74% 6%, 98% 50%, 74% 94%, 26% 94%, 2% 50%); }
.gx.g2 { --gc: var(--cA); --clip: polygon(50% 4%, 98% 90%, 2% 90%); }
.gx.g3 { --gc: var(--cR); --clip: polygon(50% 2%, 62% 36%, 98% 38%, 70% 60%, 80% 96%, 50% 74%, 20% 96%, 30% 60%, 2% 38%, 38% 36%); }
.gx.g4 { --gc: var(--cT); --clip: circle(48%); }
.gx.g5 { --gc: #fff; --clip: circle(48%); }
.gx .sh { position: absolute; inset: 9%; clip-path: var(--clip); background: linear-gradient(135deg, rgba(255, 255, 255, .7) 0, rgba(255, 255, 255, 0) 38%, rgba(0, 0, 0, .3) 100%), var(--gc); }
.gx .sh::after { content: ""; position: absolute; left: 22%; top: 14%; width: 26%; height: 16%; border-radius: 50%; background: rgba(255, 255, 255, .6); transform: rotate(-32deg); }
.gx b { position: relative; font-family: var(--f-display); font-weight: 400; font-size: calc(var(--s, var(--cell)) * .42); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .38); line-height: 1; }
.gx.g2 b { margin-top: 16%; }
.gx.g3 b { margin-top: 3%; }
.gx .arr { position: absolute; right: 8%; top: 4%; font-style: normal; font-size: calc(var(--s, var(--cell)) * .26); color: #fff; text-shadow: 0 0 6px #000; z-index: 2; }
.gx.sp1 .sh, .gx.sp2 .sh { background: repeating-linear-gradient(var(--ang, 90deg), rgba(255, 255, 255, .55) 0 4px, transparent 4px 9px), linear-gradient(135deg, rgba(255, 255, 255, .7) 0, rgba(255, 255, 255, 0) 38%, rgba(0, 0, 0, .3) 100%), var(--gc); }
.gx.sp2 { --ang: 0deg; }
.gx.sp3 .sh { box-shadow: none; animation: pulseb 1s infinite alternate; }
.gx.sp3::before { content: ""; position: absolute; inset: 2%; border-radius: 50%; border: 3px solid #fff; opacity: .8; animation: pulser 1s infinite alternate; }
.gx.sp4 .sh { background: conic-gradient(#ff4d6d, #ff9a1f, #ffd24a, #2fd07a, #3b9bff, #b36bff, #ff4d6d); animation: spin 3s linear infinite; }
.gx.sp4 b { font-size: calc(var(--s, var(--cell)) * .5); }
@keyframes pulseb { to { filter: brightness(1.45); } }
@keyframes pulser { to { transform: scale(1.08); opacity: .3; } }
@keyframes spin { to { transform: rotate(360deg); } }

.gi { --s: 30px; position: relative; display: inline-grid; place-items: center; width: var(--s); height: var(--s); vertical-align: middle; flex: none; }
.gi.big { --s: 54px; }
.gi.lg { --s: 44px; }
.gem { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); display: grid; place-items: center; z-index: 2; touch-action: none;
  transform: translate(calc(var(--c) * var(--cell)), calc(var(--r) * var(--cell))); transition: transform .22s cubic-bezier(.3, .8, .4, 1); filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .5)); }
.gem.sel { filter: drop-shadow(0 0 8px #fff) drop-shadow(0 3px 2px rgba(0, 0, 0, .5)); scale: 1.14; z-index: 3; }
.gem.pop { animation: popg .24s forwards; z-index: 4; }
.gem.spawn { animation: spawn .36s; }
.gem.shake { animation: shake .26s; }
.gem.hintp { animation: hintp .8s infinite; }
@keyframes popg { to { scale: 1.45; opacity: 0; filter: brightness(2); } }
@keyframes spawn { 0% { scale: 0; } 60% { scale: 1.3; } 100% { scale: 1; } }
@keyframes shake { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
@keyframes hintp { 50% { scale: 1.18; filter: brightness(1.5) drop-shadow(0 0 8px #fff); } }

/* ---------- Título ---------- */
.title { text-align: center; padding-top: 4vh; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.logo { display: flex; gap: 4px; justify-content: center; }
.logo .gi { --s: min(17vw, 78px); animation: bob 2.4s ease-in-out infinite; }
.logo .gi:nth-child(2) { animation-delay: .15s; } .logo .gi:nth-child(3) { animation-delay: .3s; } .logo .gi:nth-child(4) { animation-delay: .45s; } .logo .gi:nth-child(5) { animation-delay: .6s; }
@keyframes bob { 50% { transform: translateY(-9px) rotate(3deg); } }
.title h1 { font-size: clamp(40px, 12vw, 64px); line-height: .95; color: var(--gold); text-shadow: 0 4px 0 #9a4d00, 0 10px 24px rgba(0, 0, 0, .45); }
.title p.lead { max-width: 30ch; margin: 0; color: var(--muted); font-size: 18px; }
.menu { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.menu .btn { width: 100%; }
.credit { font-size: 13px; color: var(--muted); opacity: .85; margin-top: 8px; }
.namebox { display: flex; gap: 8px; width: 100%; max-width: 360px; }
.namebox input { flex: 1; min-width: 0; min-height: 52px; border-radius: 16px; border: 2px solid var(--line); background: var(--card2); color: var(--ink); padding: 0 16px; font: inherit; font-size: 18px; user-select: text; -webkit-user-select: text; }

/* ---------- Mundos ---------- */
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
@media (max-width: 380px) { .wgrid { grid-template-columns: 1fr; } }
.wcard { text-align: left; border-radius: 22px; border: 2px solid var(--line); padding: 14px; color: var(--ink); display: flex; flex-direction: column; gap: 6px; min-height: 150px; position: relative; overflow: hidden;
  background: linear-gradient(160deg, var(--w1), var(--w2)); box-shadow: 0 6px 0 rgba(0, 0, 0, .35); }
.wcard .em { font-size: 40px; line-height: 1; }
.wcard h3 { font-size: 20px; line-height: 1.05; }
.wcard small { color: rgba(255, 255, 255, .8); font-size: 13px; }
.wcard .pr { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.wcard.lock { filter: grayscale(.85) brightness(.7); }
.wcard.lock::after { content: "🔒"; position: absolute; right: 12px; top: 10px; font-size: 22px; }
.bar { height: 10px; border-radius: 8px; background: rgba(0, 0, 0, .35); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 8px; transition: width .4s; }

/* ---------- Mapa de niveles ---------- */
.whead { text-align: center; margin: 4px 0 10px; }
.whead .em { font-size: 44px; }
.whead h2 { font-size: 28px; }
.lmap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 10px; border-radius: 24px; background: var(--card2); border: 2px solid var(--line); }
.lv { aspect-ratio: 1; border-radius: 18px; border: 2px solid var(--line); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 22px; gap: 0; padding: 2px; position: relative; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
.lv .st { font-size: 11px; letter-spacing: -1px; color: var(--gold); line-height: 1; min-height: 12px; }
.lv.done { background: linear-gradient(160deg, rgba(53, 224, 138, .35), rgba(53, 224, 138, .1)); border-color: rgba(53, 224, 138, .7); }
.lv.cur { background: linear-gradient(180deg, var(--gold), var(--gold2)); color: var(--on-gold); border-color: #fff; animation: curp 1.2s infinite alternate; }
.lv.lock { opacity: .4; pointer-events: none; box-shadow: none; }
.lv.boss { grid-column: span 5; aspect-ratio: auto; min-height: 76px; flex-direction: row; gap: 14px; font-size: 22px; background: linear-gradient(160deg, rgba(255, 77, 109, .3), rgba(179, 107, 255, .25)); }
.lv.boss.cur { background: linear-gradient(180deg, var(--gold), var(--gold2)); }
.lv.boss .be { font-size: 38px; line-height: 1; }
@keyframes curp { to { transform: scale(1.07); } }

/* ---------- Partida ---------- */
.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.pill { border-radius: 16px; background: var(--card2); border: 2px solid var(--line); padding: 4px 12px; text-align: center; }
.pill small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pill b { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pill.moves { min-width: 92px; }
.pill.moves.low b { color: var(--bad); animation: curp .5s infinite alternate; }
.goals { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
.goal { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px; border-radius: 999px; background: var(--card2); border: 2px solid var(--line); font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.goal.ok { border-color: var(--good); background: rgba(53, 224, 138, .18); }
.goal.ok::after { content: "✔"; color: var(--good); }
.boardwrap { display: grid; place-items: center; }
.board { --n: 6; --cell: min(calc((100vw - 48px) / var(--n)), 66px);
  position: relative; width: calc(var(--n) * var(--cell)); height: calc(var(--n) * var(--cell)); border-radius: 20px; touch-action: none; overflow: hidden;
  background-color: rgba(7, 10, 40, .6); background-image: conic-gradient(rgba(255, 255, 255, .08) 25%, transparent 0 50%, rgba(255, 255, 255, .08) 0 75%, transparent 0); background-size: calc(var(--cell) * 2) calc(var(--cell) * 2);
  border: 3px solid var(--line); box-shadow: 0 0 30px color-mix(in srgb, var(--glow) 35%, transparent), inset 0 0 30px rgba(0, 0, 0, .4); }
@supports (height: 100dvh) { .board { --cell: min(calc((100vw - 48px) / var(--n)), calc((100dvh - 330px) / var(--n)), 66px); } }
.board.hammer { cursor: crosshair; box-shadow: 0 0 0 3px var(--gold), 0 0 30px var(--gold); }
.ice { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); transform: translate(calc(var(--c) * var(--cell)), calc(var(--r) * var(--cell))); z-index: 1; pointer-events: none;
  background: linear-gradient(135deg, rgba(190, 240, 255, .5), rgba(120, 200, 255, .25)); border: 2px solid rgba(225, 250, 255, .85); border-radius: 10px; box-shadow: inset 0 0 14px rgba(255, 255, 255, .7); }
.ice.h2 { background: linear-gradient(135deg, rgba(220, 250, 255, .78), rgba(140, 210, 255, .5)); border-width: 4px; }
.ice.brk { animation: icebrk .35s forwards; }
@keyframes icebrk { to { scale: 1.3; opacity: 0; } }
.fxl { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
.beam { position: absolute; background: linear-gradient(90deg, transparent, #fff, transparent); opacity: 0; animation: beam .45s ease-out; }
.beam.h { left: 0; width: 100%; height: calc(var(--cell) * .8); top: calc(var(--r) * var(--cell) + var(--cell) * .1); }
.beam.v { top: 0; height: 100%; width: calc(var(--cell) * .8); left: calc(var(--c) * var(--cell) + var(--cell) * .1); background: linear-gradient(180deg, transparent, #fff, transparent); }
@keyframes beam { 20% { opacity: 1; } 100% { opacity: 0; } }
.ring { position: absolute; width: calc(var(--cell) * 1.2); height: calc(var(--cell) * 1.2); left: calc(var(--c) * var(--cell) - var(--cell) * .1); top: calc(var(--r) * var(--cell) - var(--cell) * .1); border-radius: 50%; border: 5px solid #fff; animation: ring .5s ease-out forwards; }
@keyframes ring { to { scale: 4.2; opacity: 0; } }
.flash { position: absolute; inset: 0; background: radial-gradient(circle, #fff, transparent 70%); animation: beam .6s ease-out; }
.pt { position: absolute; width: 8px; height: 8px; border-radius: 50%; left: calc(var(--c) * var(--cell) + var(--cell) / 2); top: calc(var(--r) * var(--cell) + var(--cell) / 2); background: var(--pc, #fff); animation: pt .5s ease-out forwards; }
@keyframes pt { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
.pts { position: absolute; font-family: var(--f-display); font-size: calc(var(--cell) * .42); color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px var(--gold); left: calc(var(--c) * var(--cell)); top: calc(var(--r) * var(--cell)); animation: pts .8s ease-out forwards; white-space: nowrap; }
@keyframes pts { to { transform: translateY(-34px); opacity: 0; } }
.boost { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
.boost .btn { min-height: 46px; font-size: 17px; padding: 6px 16px; }
.boost .btn.on { outline: 3px solid #fff; }
.banner { position: absolute; inset: 0; display: grid; place-items: center; z-index: 8; pointer-events: none; }
.banner span { font-family: var(--f-display); font-size: clamp(22px, 7vw, 34px); padding: 10px 22px; border-radius: 20px; background: rgba(10, 14, 48, .85); border: 3px solid var(--gold); color: var(--gold); animation: ban 1.4s forwards; text-align: center; }
@keyframes ban { 0% { scale: .4; opacity: 0; } 15% { scale: 1.1; opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; scale: 1; } }

/* ---------- Retos ---------- */
.chead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.chead .mo { font-size: 44px; line-height: 1; }
.chead .mid { flex: 1; min-width: 0; }
.chead .nm { font-family: var(--f-display); font-size: 18px; }
.dots { display: flex; gap: 6px; margin-top: 6px; }
.dots i { flex: 1; height: 10px; border-radius: 6px; background: rgba(0, 0, 0, .35); border: 1.5px solid var(--line); }
.dots i.on { background: linear-gradient(90deg, var(--good), #8cf5bf); border-color: transparent; }
.dots i.cur { background: var(--gold); border-color: transparent; animation: curp .6s infinite alternate; }
.boss .mo { animation: bob 2s infinite; }
.boss.hit .mo { animation: shake .4s; }
.q { display: flex; flex-direction: column; gap: 12px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qtype { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.mini { min-width: 40px; height: 36px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 18px; }
.prompt { font-size: clamp(21px, 5.6vw, 27px); line-height: 1.12; }
.stmt { padding: 14px; border-radius: 16px; background: var(--card2); border: 2px solid var(--line); font-size: 19px; line-height: 1.35; user-select: text; -webkit-user-select: text; }
.stmt mark { background: color-mix(in srgb, var(--gold) 55%, transparent); color: #fff; border-radius: 6px; padding: 1px 4px; box-shadow: 0 0 0 2px var(--gold); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opts.r1 { flex-direction: row; }
.opts.g2 { display: grid; grid-template-columns: 1fr 1fr; }
.opts.r1 .opt { flex: 1; justify-content: center; text-align: center; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 12px 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--card); font-size: 18px; text-align: left; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); line-height: 1.25; }
.opt.long { font-size: 17px; align-items: flex-start; }
.opt:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.opt .ob { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); background: var(--oc, rgba(255, 255, 255, .2)); color: #fff; flex: none; text-shadow: 0 1px 0 rgba(0, 0, 0, .4); }
.opt.right { background: rgba(53, 224, 138, .25); border-color: var(--good); }
.opt.wrong { background: rgba(255, 93, 115, .2); border-color: var(--bad); animation: shakeb .3s; pointer-events: none; opacity: .75; }
.opt.gone { opacity: .22; pointer-events: none; }
@keyframes shakeb { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.fb { margin-top: 12px; padding: 14px; border-radius: 18px; border: 2px solid var(--line); background: var(--card2); }
.fb.ok { border-color: var(--good); background: rgba(53, 224, 138, .13); }
.fb.no { border-color: var(--bad); background: rgba(255, 93, 115, .12); }
.fb h3 { font-size: 20px; margin-bottom: 4px; }
.fb p { margin: 0; font-size: 16px; }
.fb .btn { width: 100%; margin-top: 12px; }
.chbar { display: flex; justify-content: center; margin-top: 14px; }
.bk { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.chip { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 14px; background: rgba(0, 0, 0, .25); border: 2px solid var(--c, var(--line)); font-size: 14.5px; line-height: 1.25; }

/* ============================================================
   Generadores de retos y configuración de los 200 niveles
   Todo es determinista por nivel (semilla) y no toca el DOM.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function RNG(seed) {
  const f = mulberry32((Math.imul(seed | 0, 2654435761) ^ 0x9e3779b9) | 0);
  const o = {
    f,
    i: n => Math.floor(f() * n),
    pick: a => a[Math.floor(f() * a.length)],
    shuffle: a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
    sample: (a, n) => o.shuffle(a).slice(0, n)
  };
  return o;
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/* ---------- Niveles ---------- */
function lvInfo(n) {
  const w = Math.floor((n - 1) / 25);
  const idx = ((n - 1) % 25) + 1;
  return { n, w, idx, phase: idx <= 8 ? 0 : idx <= 16 ? 1 : idx <= 24 ? 2 : 3, boss: idx === 25, mini: idx % 5 === 0 && idx < 25 };
}

/* ---------- Variantes de una meta ---------- */
function mkVariant(sc, kind) {
  const S = { k: "S", t: sc.S }, M = { k: "M", t: sc.M }, A = { k: "A", t: sc.A }, R = { k: "R", t: sc.R }, T = { k: "T", t: sc.T };
  let segs, missing = [], flaw = null;
  switch (kind) {
    case "smart": segs = [S, M, A, R, T]; break;
    case "vague": segs = [{ k: null, t: sc.vague.replace(/\.$/, "") }]; missing = ["S", "M", "A", "R", "T"]; flaw = "S"; break;
    case "noM": segs = [S, A, R, T]; missing = ["M"]; flaw = "M"; break;
    case "noR": segs = [S, M, A, T]; missing = ["R"]; flaw = "R"; break;
    case "noT": segs = [S, M, A, R]; missing = ["T"]; flaw = "T"; break;
    case "unreal": segs = [S, { k: "M", t: sc.xM, bad: 1 }, A, R, { k: "T", t: sc.xT, bad: 1 }]; flaw = "A"; break;
    default: throw new Error("variante desconocida " + kind);
  }
  return { kind, sc, segs, missing, flaw, smart: kind === "smart", text: segs.map(s => s.t).join(", ") + "." };
}
const FLAW_KIND = { S: "vague", M: "noM", A: "unreal", R: "noR", T: "noT" };

function whyVariant(v) {
  if (v.smart) return "¡Tiene las 5 letras! S: qué hago · M: cuánto · A: cómo · R: para qué · T: para cuándo.";
  if (v.kind === "vague") return "Es una meta normal (un deseo): no dice cuánto, cómo, para qué ni para cuándo.";
  if (v.kind === "unreal") return "Tiene número y fecha, pero es imposible de lograr. Le falta la A de Alcanzable.";
  const L = LET[v.flaw];
  return "Casi lo logra, pero le falta la " + v.flaw + " de " + L.name + ": no responde «" + L.key + "».";
}

function breakdownHTML(v) {
  if (v.kind === "vague") return '<div class="bk"><div class="chip miss"><b>—</b><span>Solo es un deseo: faltan S, M, A, R y T</span></div></div>';
  let out = '<div class="bk">';
  LK.forEach(k => {
    const L = LET[k];
    const seg = v.segs.find(s => s.k === k);
    if (v.kind === "unreal" && k === "A") {
      out += '<div class="chip bad" style="--c:' + L.color + '"><b>A</b><span>No es alcanzable: el número y el plazo son demasiado grandes</span></div>';
    } else if (seg) {
      out += '<div class="chip ' + (seg.bad ? "warn" : "ok") + '" style="--c:' + L.color + '"><b>' + k + "</b><span>" + esc(seg.t) + "</span></div>";
    } else {
      out += '<div class="chip miss" style="--c:' + L.color + '"><b>' + k + "</b><span>Falta: " + esc(L.key) + "</span></div>";
    }
  });
  return out + "</div>";
}

/* ---------- Utilidades de generación ---------- */
function pickSC(rng, ctx, notId) {
  ctx.used = ctx.used || new Set();
  let pool = SC.filter(s => !ctx.used.has(s.id) && s.id !== notId);
  if (ctx.w === 6 && rng.f() < 0.7) { const p2 = pool.filter(s => s.fin); if (p2.length) pool = p2; }
  if (!pool.length) pool = SC;
  const sc = rng.pick(pool);
  ctx.used.add(sc.id);
  return sc;
}
const stmt = t => '<div class="stmt">' + esc(t) + "</div>";
const SMARTLET = "SMART";

/* ---------- Generadores por tipo ---------- */
const GEN = {};

GEN.tf = (rng, ctx) => {
  const tag = ctx.arg === "L" ? (ctx.L || "G") : (ctx.arg || "G");
  ctx.usedTF = ctx.usedTF || new Set();
  let pool = TF.filter(t => t.g === tag && !ctx.usedTF.has(t.s));
  if (!pool.length) pool = TF.filter(t => t.g === tag);
  const t = rng.pick(pool); ctx.usedTF.add(t.s);
  return {
    type: "tf", kind: "choice", prompt: "¿Verdadero o falso?", stem: stmt(t.s),
    opts: [{ id: "v", label: "✔ Verdadero" }, { id: "f", label: "✘ Falso" }],
    correct: t.a ? "v" : "f", why: { v: t.a ? "" : t.e, f: t.a ? t.e : "" }, explain: t.e, row: 1
  };
};

GEN.classify = (rng, ctx) => {
  const diff = ctx.arg || "mid";
  const sc = pickSC(rng, ctx);
  let kinds;
  if (ctx.L) kinds = [FLAW_KIND[ctx.L]];
  else if (diff === "easy") kinds = ["vague"];
  else if (diff === "mid") kinds = ["vague", "noM", "noR", "noT"];
  else kinds = ["noM", "noR", "noT", "unreal", "vague"];
  const kind = rng.f() < 0.5 ? "smart" : rng.pick(kinds);
  const v = mkVariant(sc, kind);
  return {
    type: "classify", kind: "choice", prompt: "¿Qué tipo de meta es esta?", stem: stmt(v.text),
    opts: [{ id: "n", label: "📝 Meta normal" }, { id: "s", label: "💎 Meta SMART" }],
    correct: v.smart ? "s" : "n",
    why: { n: v.smart ? "Esta sí cumple las 5 letras. Busca la S, la M, la A, la R y la T." : "", s: v.smart ? "" : whyVariant(v) },
    explain: whyVariant(v), explainHTML: breakdownHTML(v), row: 1
  };
};

GEN.findSmart = (rng, ctx) => {
  const n = parseInt(ctx.arg, 10) || 3;
  const sc = pickSC(rng, ctx);
  const good = mkVariant(sc, "smart");
  let kinds;
  if (ctx.L) kinds = [FLAW_KIND[ctx.L]];
  else if (n === 2) kinds = ["vague"];
  else kinds = ["vague", "noM", "noR", "noT", "unreal"];
  const opts = [{ id: "good", label: good.text, v: good }];
  const usedKinds = [];
  for (let i = 0; i < n - 1; i++) {
    const sc2 = pickSC(rng, ctx);
    let k = rng.pick(kinds);
    if (kinds.length > 1 && usedKinds.length < kinds.length) { let tries = 0; while (usedKinds.includes(k) && tries++ < 8) k = rng.pick(kinds); }
    usedKinds.push(k);
    const v = mkVariant(sc2, k);
    opts.push({ id: "d" + i, label: v.text, v });
  }
  const shuffled = rng.shuffle(opts);
  const why = {};
  shuffled.forEach(o => { if (o.id !== "good") why[o.id] = whyVariant(o.v); });
  return {
    type: "findSmart", kind: "choice", prompt: "¿Cuál de estas metas es SMART?", stem: "",
    opts: shuffled.map(o => ({ id: o.id, label: o.label })), correct: "good", why,
    explain: whyVariant(good), explainHTML: breakdownHTML(good), row: 0
  };
};

GEN.missing = (rng, ctx) => {
  const letters = ["M", "A", "R", "T"];
  const L = ctx.L && ctx.L !== "S" ? ctx.L : rng.pick(letters);
  const sc = pickSC(rng, ctx);

  const why = {};
  letters.forEach(k => {
    if (k === L) return;
    const seg = v.segs.find(s => s.k === k);
    if (v.kind === "unreal") why[k] = k === "A" ? "" : "Sí tiene " + (k === "M" ? "número" : "plazo") + " («" + seg.t + "»), pero es demasiado exagerado para lograrlo.";
    else why[k] = seg ? "Esa letra sí está: «" + seg.t + "»." : "";
  });
  return {
    type: "missing", kind: "choice", prompt: "Esta meta ya dice QUÉ quiere lograr (S), pero le falta otra letra. ¿Cuál?",
    stem: stmt(v.text),

};

GEN.tap = (rng, ctx) => {

function cmpVariants(sc, k, rng) {
  switch (k) {
    case "S": return { good: sc.S + ".", weak: sc.vague, why: "La primera dice exactamente QUÉ se va a hacer. La otra es un deseo general." };
    case "M": return { good: sc.S + ", " + sc.M + ".", weak: sc.S + ", " + rng.pick(WEAK.M) + ".", why: "Tiene un número que se puede contar. «Muchas veces» o «bastante» no se pueden comprobar." };
    case "A": return { good: sc.S + ", " + sc.M + ", " + sc.A + ".", weak: sc.S + ", " + sc.xM + ", " + rng.pick(WEAK.A) + ".", why: "Es un reto posible con un plan real. La otra es exagerada y sin recursos." };
    case "R": return { good: sc.S + ", " + sc.R + ".", weak: sc.S + ", " + rng.pick(WEAK.R) + ".", why: "Tiene un propósito que le importa a quien la pone. «Porque sí» no motiva." };
    default: return { good: sc.S + ", " + sc.T + ".", weak: sc.S + ", " + rng.pick(WEAK.T) + ".", why: "Tiene fecha o plazo. «Algún día» significa «nunca»." };
  }
}
GEN.compare = (rng, ctx) => {

};

GEN.build = (rng, ctx) => {

  if (ctx.L) { const others = rng.sample(LK.filter(k => k !== ctx.L), n - 1); chosen = LK.filter(k => k === ctx.L || others.includes(k)); }
  else chosen = LK.filter(k => rng.sample(LK, n).includes(k));
  const weakOf = {
    S: () => [sc.vague.replace(/\.$/, ""), rng.pick(WEAK.S)],

  };
  const slots = LK.map(k => {

GEN.hangman = (rng, ctx) => {

/* ---------- Plan de retos por mundo ---------- */
function planFor(w) {
  const f = WORLDS[w].focus;
  if (w === 0) return {
    p0: ["tf:G", "classify:easy", "tf:G", "classify:easy", "match:letters"],
    p1: ["classify:easy", "findSmart:2", "match:questions", "tf:G", "classify:mid", "hangman"],
    p2: ["classify:mid", "findSmart:3", "match:english", "whichLetter", "missing", "order:2"],
    boss: ["classify:mid", "findSmart:3", "tf:G", "match:history", "missing"]
  };
  if (f) {
    const extra = {
      M: ["taskres", "order:0", "match:method"], A: ["tf:L"], R: ["tf:L"], T: ["order:1"], S: ["tf:L"]
    }[f];
    const p2 = ["findSmart:3", f === "S" ? "tap:L" : "missing:L", "tap:L", "classify:L", "build:2", "order:3"];
    if (f === "M") { p2[5] = "order:0"; p2.push("taskres"); }
    if (f === "T") { p2[5] = "order:1"; }
    return {
      p0: ["tf:L", "yesno:L", "compare:L", "yesno:L", "whichLetter:L"].concat(f === "M" ? ["taskres"] : []),
      p1: ["compare:L", "tap:L", "whichLetter:L", "tf:L", "classify:L", "hangman"].concat(extra.slice(0, 1)),
      p2,
      boss: ["compare:L", "tap:L", f === "S" ? "whichLetter:L" : "missing:L", "findSmart:4", "build:3", "tf:L"]
    };
  }
  if (w === 6) return {
    p0: ["whichLetter", "tap", "classify:mid", "missing", "findSmart:3", "tf:F"],
    p1: ["missing", "findSmart:4", "match:kpi", "match:fintech", "tf:F", "taskres", "build:3"],
    p2: ["missing", "classify:hard", "build:4", "findSmart:4", "whichLetter", "tf:F", "match:ex"],
    boss: ["missing", "findSmart:4", "build:5", "match:kpi", "tap", "taskres"]
  };
  return {
    p0: ["classify:hard", "missing", "build:4", "findSmart:4", "tap", "match:ex"],
    p1: ["build:5", "missing", "match:ex", "findSmart:4", "whichLetter", "order:3", "hangman"],
    p2: ["build:5", "missing", "classify:hard", "tap", "tf:G", "order:0", "match:ex"],
    boss: ["build:5", "missing", "findSmart:4", "classify:hard", "match:ex", "tap"]
  };
}
const PLAN_CACHE = {};

function numQuestions(info) {
  if (info.boss) return planFor(info.w).boss.length;
  return info.mini ? 3 : 2;
}

function makeChallenge(n) {
  const info = lvInfo(n);
  const plan = PLAN_CACHE[info.w] || (PLAN_CACHE[info.w] = planFor(info.w));
  const list = info.boss ? plan.boss : plan["p" + info.phase];
  const nq = numQuestions(info);
  const rng = RNG(n * 131 + 7);
  const start = info.boss ? 0 : (info.idx * 2 + info.w) % list.length;
  const ctx = { w: info.w, L: WORLDS[info.w].focus, used: new Set() };
  const qs = [];
  for (let j = 0; j < nq; j++) {
    const spec = list[(start + j) % list.length];
    const parts = spec.split(":");
    const type = parts[0];
    let arg = parts[1];
    const c = Object.assign({}, ctx, { arg });
    if (arg === "L" || !ctx.L) { if (arg === "L") c.arg = "L"; }
    // en mundos de letra, los tipos sin ":L" también se centran en la letra
    const q = GEN[type](rng, c);
    ctx.used = c.used; ctx.usedTF = c.usedTF; ctx.usedTR = c.usedTR; ctx.usedH = c.usedH;
    q.spec = spec;
    qs.push(q);
  }
  return qs;
}

/* ---------- Configuración del tablero de cada nivel ---------- */
const TUNE = {
  per0: 8, per1: 25, rate: [1.6, 2.1, 3.5], mult: [1, 0.78, 0.62],
  dBase: 1.06, dSpan: 1.14, dExp: 3.5,
  iceFrac0: 0.12, iceFrac1: 0.30, iceA: 4, iceB: 0.9,
  scoreMove0: 140, scoreMove1: 185
};
function dFactor(p) { return TUNE.dBase + TUNE.dSpan * Math.pow(1 - p, TUNE.dExp); }

function levelConfig(n) {
  const info = lvInfo(n);
  const { w, idx, boss, mini } = info;
  const r = RNG(n * 977 + 31);
  const p = (n - 1) / 199;
  const size = w < 2 ? 6 : 7;
  const wf = WORLDS[w].focus;
  const fi = wf ? LK.indexOf(wf) : -1;
  let kind = "collect";
  if (boss) kind = "ice";
  else if (mini && w >= 1) kind = "ice";
  else if (w >= 1 && idx % 4 === 2) kind = "score";
  if (n <= 5) kind = "collect";
  if (w === 0 && idx === 10) kind = "ice";
  const cfg = { n, w, idx, size, kind, boss, goals: [], ice: [], score: 0, moves: 20, hammers: boss ? 2 : 1, types: 5 };
  const d = dFactor(p);

  const nLet = n < 15 ? 1 : n < 80 ? 2 : 3;
  const pickLetters = k => {
    const set = [];
    if (fi >= 0) set.push(fi);
    const pool = r.shuffle([0, 1, 2, 3, 4].filter(x => x !== fi));
    while (set.length < k) set.push(pool.shift());
    return set.slice(0, k);
  };

  let needCollect = 0, needIce = 0;
  if (kind === "collect" || kind === "ice") {
    if (kind === "collect" || boss) {
      const k = kind === "ice" ? Math.min(2, nLet) : nLet;
      const per = Math.round((TUNE.per0 + (TUNE.per1 - TUNE.per0) * p) * TUNE.mult[k - 1] * (kind === "ice" ? 0.75 : 1));
      pickLetters(k).forEach(t => cfg.goals.push({ t, n: per }));
      needCollect = (per * k) / TUNE.rate[k - 1];
    }
  }
  if (kind === "ice") {
    const cells = size * size;
    const cnt = Math.round(cells * (TUNE.iceFrac0 + (TUNE.iceFrac1 - TUNE.iceFrac0) * p) * (boss ? 1.1 : 1));
    const all = r.shuffle(Array.from({ length: cells }, (_, i) => i)).slice(0, cnt);
    const two = p > 0.45;
    all.forEach(i => cfg.ice.push({ r: Math.floor(i / size), c: i % size, h: two && r.f() < 0.35 ? 2 : 1 }));
    const hits = cfg.ice.reduce((a, b) => a + b.h, 0);
    needIce = TUNE.iceA + TUNE.iceB * hits;
  }
  if (kind === "score") {
    const need = 17 + 8 * p;
    cfg.moves = Math.ceil(need * d) + 2;
    cfg.score = Math.round((TUNE.scoreMove0 + (TUNE.scoreMove1 - TUNE.scoreMove0) * p) * need / 10) * 10;
  } else {
    cfg.moves = Math.ceil(Math.max(needCollect, needIce) * d * (boss ? 1.05 : 1)) + 2;
  }
  cfg.moves = Math.max(10, Math.min(cfg.moves, 45));
  return cfg;
}

function levelTitle(n) {
  const i = lvInfo(n);
  return "Nivel " + n + " · " + WORLDS[i.w].name;
}

"use strict";
/* ============================================================
   Defensa SMART (niveles 201-300): motor sin DOM + configuración
   Las metas normales bajan hacia la base. Cada torre-letra les
   agrega la letra que les falta. Las metas SMART no se tocan.
   ============================================================ */

const TD_FIRST = 8;           // primer mundo de defensa
const TD_HEARTS = 5;
const TD_CARD_GAP = 0.32;     // separación mínima entre tarjetas (fracción del recorrido)

const TD_HMAX = 118;
const tdH = (text, boss) => Math.min(TD_HMAX, Math.max(64, 22 + Math.ceil(text.length / 38) * 15.8 + (boss ? 16 : 0)));
const cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);

/* Meta con letras quitadas (drop) */
function tdDrop(sc, drop) {
  const all = { S: sc.S, M: sc.M, A: sc.A, R: sc.R, T: sc.T };
  const segs = LK.filter(k => drop.indexOf(k) < 0).map(k => ({ k, t: all[k] }));
  return { vk: "drop", segs, need: drop.slice(), text: cap1(segs.map(s => s.t).join(", ")) + "." };
}
function tdUnreal(sc) {
  const v = mkVariant(sc, "unreal");
  return { vk: "unreal", segs: v.segs, need: ["A"], text: v.text };
}
function tdSmart(sc) {
  const v = mkVariant(sc, "smart");
  return { vk: "smart", segs: v.segs, need: [], text: v.text };
}
function tdVague(sc) {
  return { vk: "vague", segs: [], need: LK.slice(), text: sc.vague };
}

/* ---------- Configuración de un nivel ---------- */
const TD_P = [
  { n: [7, 12], cross: [34, 27], ally: [0, .2], f2: [0, .2], f3: [0, 0], real: 0, fin: 0, regen: .55 },
  { n: [9, 14], cross: [31, 25], ally: [.15, .25], f2: [.25, .55], f3: [0, 0], real: .1, fin: .9, regen: .6 },
  { n: [10, 16], cross: [28, 22], ally: [.3, .4], f2: [.2, .5], f3: [0, .12], real: .25, fin: .5, regen: .65 },
  { n: [12, 18], cross: [26, 19], ally: [.2, .3], f2: [.3, .5], f3: [.1, .3], real: .2, fin: .5, regen: .7 }
];
const lerp = (a, b, t) => a + (b - a) * t;

function tdConfig(n) {
  const info = lvInfo(n), k = info.w - TD_FIRST, idx = info.idx, p = (idx - 1) / 24, P = TD_P[k];
  const rng = RNG(n * 977 + 31);
  const W = WORLDS[info.w];
  let count = Math.round(lerp(P.n[0], P.n[1], p)) + (info.mini ? 3 : 0) + (info.boss ? 4 : 0);
  const cross = lerp(P.cross[0], P.cross[1], p);
  const allyP = k === 0 && idx <= 3 ? 0 : lerp(P.ally[0], P.ally[1], p);
  const f2 = lerp(P.f2[0], P.f2[1], p), f3 = lerp(P.f3[0], P.f3[1], p);
  let letters = LK.slice();
  if (k === 0) letters = idx <= 8 ? ["M", "R", "T"] : idx <= 16 ? ["S", "M", "R", "T"] : LK.slice();
  const used = new Set();
  const pickScn = () => {
    let pool = SC.filter(s => !used.has(s.id));
    if (rng.f() < P.fin) { const q = pool.filter(s => s.fin); if (q.length) pool = q; }
    if (!pool.length) pool = SC;
    const sc = rng.pick(pool); used.add(sc.id); return sc;
  };
  const seq = [];
  const bossPos = info.boss ? count - 4 : -1, elitePos = info.mini ? Math.floor(count / 2) : -1;
  for (let i = 0; i < count; i++) {
    const sc = pickScn();
    let e;
    if (i === bossPos) { e = tdVague(sc); e.kind = "boss"; e.speed = 0.7; }
    else if (i === elitePos) {
      const ls = rng.sample(letters.length >= 3 ? letters : LK, 3); e = tdDrop(sc, LK.filter(x => ls.indexOf(x) >= 0)); e.kind = "foe"; e.elite = 1; e.speed = 0.9;
    } else if (i >= 2 && rng.f() < allyP) { e = tdSmart(sc); e.kind = "ally"; e.speed = 1; }
    else {
      const r = rng.f();
      if (i >= 2 && letters.indexOf("A") >= 0 && rng.f() < P.real && idx > 8 || (k === 0 && idx > 16 && i === 3)) { e = tdUnreal(sc); }
      else {
        const nf = i < 2 ? 1 : r < f3 ? 3 : r < f3 + f2 ? 2 : 1;
        const ls = rng.sample(letters, Math.min(nf, letters.length));
        e = tdDrop(sc, LK.filter(x => ls.indexOf(x) >= 0));
      }
      e.kind = "foe"; e.speed = 1;
    }
    e.id = i + 1; e.sc = sc.id; e.h = Math.round(tdH(e.text, e.kind === "boss"));
    seq.push(e);
  }
  return {
    n, w: info.w, idx, info, seq, cross,
    interval: cross * (0.30 - 0.05 * p - 0.01 * k), travel: 280,
    regen: P.regen, emax: 6, e0: 5, hearts: TD_HEARTS, lupas: info.boss ? 4 : 3, 
    needed: seq.filter(e => e.kind !== "ally").length, allies: seq.filter(e => e.kind === "ally").length
  };
}

/* ---------- Motor ---------- */
class TD {
  constructor(cfg) {
    this.cfg = cfg; this.t = 0; this.e = cfg.e0; this.hearts = cfg.hearts; this.lupas = cfg.lupas;
    this.en = []; this.next = 0; this.nextAt = 0.6; this.ev = []; this.over = null; this.score = 0;
    this.st = { shots: 0, wrong: 0, leaks: 0, allyHits: 0, conv: 0, saved: 0 };
    this.travel = cfg.travel || 280;
  }
  get lost() { return this.cfg.hearts - this.hearts; }
  total() { return this.cfg.seq.length; }
  remaining() { return this.total() - this.next + this.en.length; }
  emit(o) { this.ev.push(o); }
  drain() { const e = this.ev; this.ev = []; return e; }
  find(id) { return this.en.find(x => x.id === id) || null; }
  closest() {
    let b = null;
    this.en.forEach(x => { if (!b || x.y > b.y) b = x; });
    return b;
  }
  step(dt) {
    if (this.over) return;
    this.t += dt;
    this.e = Math.min(this.cfg.emax, this.e + this.cfg.regen * dt);
    // spawn
    if (this.next < this.cfg.seq.length && this.t >= this.nextAt) {
      const tail = this.en.reduce((m, x) => Math.min(m, x.y), 9);
      const spn = this.cfg.seq[this.next];
      if (this.en.length === 0 || tail >= (spn.h + 8) / this.travel) {
        const sp = this.cfg.seq[this.next++];
        const en = { id: sp.id, spec: sp, y: 0, need: sp.need.slice(), hit: [], speed: sp.speed || 1 };
        this.en.push(en); this.emit({ t: "spawn", id: en.id });
        this.nextAt = this.t + this.cfg.interval;
      }
    }
    // avance
    for (let i = this.en.length - 1; i >= 0; i--) {
      const x = this.en[i];
      x.y += dt / this.cfg.cross * x.speed;
      if (x.y >= 1) {
        this.en.splice(i, 1);
        if (x.spec.kind === "ally") { this.st.saved++; this.e = Math.min(this.cfg.emax, this.e + 2); this.score += 60; this.emit({ t: "saved", id: x.id }); }
        else {
          const dmg = x.spec.kind === "boss" ? 3 : 1;
          this.hearts = Math.max(0, this.hearts - dmg); this.st.leaks++; this.emit({ t: "leak", id: x.id, dmg });
        }
      }
    }
    if (this.hearts <= 0) { this.over = "lose"; this.emit({ t: "over", r: "lose" }); return; }
    if (this.next >= this.cfg.seq.length && this.en.length === 0) { this.over = "win"; this.emit({ t: "over", r: "win" }); }
  }
  /* dispara la letra L (a la meta id, o a la más cercana) */
  fire(L, id) {
    if (this.over) return false;
    const x = id ? this.find(id) : this.closest();
    if (!x) return false;
    if (this.e < 1) { this.emit({ t: "noenergy" }); return false; }
    this.e -= 1; this.st.shots++;
    const sp = x.spec;
    if (sp.kind === "ally") {
      this.hearts = Math.max(0, this.hearts - 1); this.st.allyHits++;
      this.en.splice(this.en.indexOf(x), 1);
      this.emit({ t: "allyhit", id: x.id, L });
      if (this.hearts <= 0) { this.over = "lose"; this.emit({ t: "over", r: "lose" }); }
      return true;
    }
    if (x.need.indexOf(L) >= 0 && x.hit.indexOf(L) < 0) {
      x.hit.push(L);
      this.score += 20;
      this.emit({ t: "hit", id: x.id, L });
      if (x.hit.length >= x.need.length) {
        this.en.splice(this.en.indexOf(x), 1);
        this.st.conv++; this.score += 40 * x.need.length + (sp.kind === "boss" ? 300 : 0);
        this.emit({ t: "conv", id: x.id, boss: sp.kind === "boss" });
        if (this.next >= this.cfg.seq.length && this.en.length === 0) { this.over = "win"; this.emit({ t: "over", r: "win" }); }
      }
      return true;
    }
    this.st.wrong++;
    x.y = Math.min(0.98, x.y + 0.04);
    this.emit({ t: "wrong", id: x.id, L, why: tdExplainWrong(x, L) });
    return true;
  }
  stars() {
    if (this.over !== "win") return 0;
    const l = this.lost, w = this.st.wrong;
    return l <= 1 && w <= 2 ? 3 : l <= 3 ? 2 : 1;
  }
}

function tdExplainWrong(x, L) {
  if (x.hit.indexOf(L) >= 0) return "La " + L + " ya se la pusiste a esta meta. Mira qué otra letra le falta.";
  const seg = x.spec.segs.find(s => s.k === L);
  if (x.spec.vk === "unreal" && (L === "M" || L === "T")) return "La " + L + " sí está, pero con un valor imposible. Lo que le falta es la A: ¿se puede lograr de verdad?";
  if (seg) return "Esta meta ya tiene la " + L + " (" + LET[L].name + "): «" + seg.t + "».";
  return "Esa letra no le hace falta a esta meta.";
}
/* qué dice la lupa de una meta */
function tdLupaChips(x) {
  const sp = x.spec;
  if (sp.vk === "vague") return LK.map(k => ({ k, st: x.hit.indexOf(k) >= 0 ? "ok" : "miss", t: x.hit.indexOf(k) >= 0 ? "Agregada" : "Falta: " + LET[k].key }));
  return LK.map(k => {
    if (x.hit.indexOf(k) >= 0) return { k, st: "ok", t: "Agregada" };
    if (sp.vk === "unreal" && k === "A") return { k, st: "bad", t: "No es alcanzable: número y plazo demasiado grandes" };
    const seg = sp.segs.find(s => s.k === k);
    if (seg) return { k, st: seg.bad ? "warn" : "ok", t: seg.t };
    return { k, st: "miss", t: "Falta: " + LET[k].key };
  });
}

"use strict";
/* ============================================================
   Motor de cristales tipo "match-3" (sin DOM)
   Gema: {id, t: 0..4 letra (S M A R T) | 5 arcoíris, sp: 0 normal | 1 fila | 2 columna | 3 bomba | 4 arcoíris}
   ============================================================ */
let GEM_ID = 1;

class Board {
  constructor(cfg, rand) {
    this.cfg = cfg;
    this.N = cfg.size;
    this.rand = rand || Math.random;
    this.types = cfg.types || 5;
    this.grid = [];
    this.ice = [];
    this.score = 0;
    this.collected = [0, 0, 0, 0, 0];
    this.totalCleared = 0;
    this.moves = cfg.moves;
    this.iceLeft = 0;
    this.hammers = cfg.hammers || 0;
    const N = this.N;
    for (let r = 0; r < N; r++) { this.grid.push(new Array(N).fill(null)); this.ice.push(new Array(N).fill(0)); }
    (cfg.ice || []).forEach(i => { this.ice[i.r][i.c] = i.h; this.iceLeft += i.h; });
    this.fillInitial();
  }

  newGem(t, sp) { return { id: GEM_ID++, t: t, sp: sp || 0 }; }
  randType() { return Math.floor(this.rand() * this.types); }
  get(r, c) { return r >= 0 && c >= 0 && r < this.N && c < this.N ? this.grid[r][c] : null; }

  fillInitial() {
    const N = this.N;
    for (let tries = 0; tries < 200; tries++) {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        let t, g = 0;
        do {
          t = this.randType(); g++;
          const l1 = this.get(r, c - 1), l2 = this.get(r, c - 2), u1 = this.get(r - 1, c), u2 = this.get(r - 2, c);
          if (g > 30) break;
          if (l1 && l2 && l1.t === t && l2.t === t) continue;
          if (u1 && u2 && u1.t === t && u2.t === t) continue;
          break;
        } while (true);
        this.grid[r][c] = this.newGem(t);
      }
      if (!this.findGroups().length && this.hasMoves()) return;
    }
  }

  /* ¿la gema en (r,c) forma 3+ en fila o columna? */
  matchAt(r, c) {
    const g = this.get(r, c);
    if (!g || g.t > 4) return false;
    let n = 1, i;
    for (i = c - 1; this.get(r, i) && this.get(r, i).t === g.t; i--) n++;
    for (i = c + 1; this.get(r, i) && this.get(r, i).t === g.t; i++) n++;
    if (n >= 3) return true;
    n = 1;
    for (i = r - 1; this.get(i, c) && this.get(i, c).t === g.t; i--) n++;
    for (i = r + 1; this.get(i, c) && this.get(i, c).t === g.t; i++) n++;
    return n >= 3;
  }

  swapCells(r1, c1, r2, c2) {
    const t = this.grid[r1][c1]; this.grid[r1][c1] = this.grid[r2][c2]; this.grid[r2][c2] = t;
  }

  /* corridas de 3+ y grupos (L/T) unidos */
  findGroups() {
    const N = this.N, runs = [];
    for (let r = 0; r < N; r++) {
      let c = 0;
      while (c < N) {
        const g = this.grid[r][c];
        if (!g || g.t > 4) { c++; continue; }
        let e = c + 1;
        while (e < N && this.grid[r][e] && this.grid[r][e].t === g.t) e++;
        if (e - c >= 3) { const cells = []; for (let k = c; k < e; k++) cells.push([r, k]); runs.push({ t: g.t, dir: "h", cells }); }
        c = e;
      }
    }
    for (let c = 0; c < N; c++) {
      let r = 0;
      while (r < N) {
        const g = this.grid[r][c];
        if (!g || g.t > 4) { r++; continue; }
        let e = r + 1;
        while (e < N && this.grid[e][c] && this.grid[e][c].t === g.t) e++;
        if (e - r >= 3) { const cells = []; for (let k = r; k < e; k++) cells.push([k, c]); runs.push({ t: g.t, dir: "v", cells }); }
        r = e;
      }
    }
    if (!runs.length) return [];
    // unir corridas que comparten celdas
    const parent = runs.map((_, i) => i);
    const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
    const owner = {};
    runs.forEach((run, i) => run.cells.forEach(([r, c]) => {
      const key = r * N + c;
      if (owner[key] !== undefined) parent[find(i)] = find(owner[key]); else owner[key] = i;
    }));
    const groups = {};
    runs.forEach((run, i) => { const k = find(i); (groups[k] = groups[k] || { t: run.t, runs: [], map: {} }).runs.push(run); });
    return Object.values(groups).map(g => {
      g.runs.forEach(run => run.cells.forEach(([r, c]) => { g.map[r * N + c] = [r, c]; }));
      g.cells = Object.values(g.map);
      return g;
    });
  }

  specialFor(g, swap) {
    const hr = g.runs.filter(x => x.dir === "h"), vr = g.runs.filter(x => x.dir === "v");
    const maxLen = Math.max.apply(null, g.runs.map(x => x.cells.length));
    let sp, t = g.t, run = null;
    if (maxLen >= 5) { sp = 4; t = 5; run = g.runs.find(x => x.cells.length >= 5); }
    else if (hr.length && vr.length) { sp = 3; }
    else if (maxLen === 4) { run = g.runs.find(x => x.cells.length === 4); sp = run.dir === "h" ? 1 : 2; }
    else return null;
    let pos = null;
    if (swap) { const hit = swap.filter(([r, c]) => g.cells.some(([rr, cc]) => rr === r && cc === c)); if (hit.length) pos = hit[0]; }
    if (!pos && sp === 3) {
      for (const [r, c] of hr[0].cells) { if (vr.some(v => v.cells.some(([rr, cc]) => rr === r && cc === c))) { pos = [r, c]; break; } }
    }
    if (!pos) { const rr = run || g.runs[0]; pos = rr.cells[Math.floor(rr.cells.length / 2)]; }
    return { r: pos[0], c: pos[1], gem: this.newGem(t, sp) };
  }

  /* combos de especiales al intercambiar */
  specialCombo(r1, c1, r2, c2) {
    const N = this.N;
    const a = this.grid[r1][c1], b = this.grid[r2][c2];
    if (!a || !b) return null;
    const forced = new Set(), fx = [];
    if (a.sp === 4 || b.sp === 4) {
      const rb = a.sp === 4 ? a : b, other = rb === a ? b : a;
      const rbPos = rb === a ? [r1, c1] : [r2, c2];
      forced.add(rbPos[0] * N + rbPos[1]);
      rb.sp = 0; // el arcoíris se consume en el combo
      if (other.sp === 4) {
        other.sp = 0;
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) forced.add(r * N + c);
        fx.push({ kind: "rainbow", r: rbPos[0], c: rbPos[1], all: true });
      } else {
        const t = other.t;
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          const g = this.grid[r][c];
          if (g && g.t === t) {
            if (other.sp > 0) g.sp = other.sp === 3 ? 3 : (this.rand() < 0.5 ? 1 : 2);
            forced.add(r * N + c);
          }
        }
        fx.push({ kind: "rainbow", r: rbPos[0], c: rbPos[1], t, convert: other.sp > 0 });
      }
      return { forced, fx };
    }
    if (a.sp > 0 && b.sp > 0) {
      forced.add(r1 * N + c1); forced.add(r2 * N + c2);
      return { forced, fx };
    }
    return null;
  }

  hasMoves() {
    const N = this.N;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const a = this.grid[r][c]; if (!a) continue;
      const nb = [[r, c + 1], [r + 1, c]];
      for (const [r2, c2] of nb) {
        if (r2 >= N || c2 >= N) continue;
        const b = this.grid[r2][c2]; if (!b) continue;
        if (a.sp === 4 || b.sp === 4 || (a.sp > 0 && b.sp > 0)) return true;
        this.swapCells(r, c, r2, c2);
        const ok = this.matchAt(r, c) || this.matchAt(r2, c2);
        this.swapCells(r, c, r2, c2);
        if (ok) return true;
      }
    }
    return false;
  }

  listMoves() {
    const N = this.N, out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const a = this.grid[r][c]; if (!a) continue;
      for (const [r2, c2] of [[r, c + 1], [r + 1, c]]) {
        if (r2 >= N || c2 >= N) continue;
        const b = this.grid[r2][c2]; if (!b) continue;
        let ok = a.sp === 4 || b.sp === 4 || (a.sp > 0 && b.sp > 0);
        if (!ok) { this.swapCells(r, c, r2, c2); ok = this.matchAt(r, c) || this.matchAt(r2, c2); this.swapCells(r, c, r2, c2); }
        if (ok) out.push([r, c, r2, c2]);
      }
    }
    return out;
  }

  trySwap(r1, c1, r2, c2) {
    if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return { ok: false };
    if (this.moves <= 0) return { ok: false };
    const a = this.grid[r1][c1], b = this.grid[r2][c2];
    if (!a || !b) return { ok: false };
    this.swapCells(r1, c1, r2, c2);
    const combo = this.specialCombo(r2, c2, r1, c1); // tras el intercambio, a está en (r2,c2) y b en (r1,c1)
    const groups = this.findGroups();
    if (!combo && !groups.length) { this.swapCells(r1, c1, r2, c2); return { ok: false }; }
    this.moves--;
    const rounds = this.resolve({ swap: [[r1, c1], [r2, c2]], forced: combo ? combo.forced : null, fx: combo ? combo.fx : null });
    return this.finish(rounds);
  }

  useHammer(r, c) {
    if (this.hammers <= 0 || !this.grid[r][c]) return { ok: false };
    this.hammers--;
    const rounds = this.resolve({ forced: new Set([r * this.N + c]) });
    return this.finish(rounds);
  }

  finish(rounds) {
    let shuffled = null;
    if (!this.done() && this.moves > 0 && !this.hasMoves()) shuffled = this.shuffleBoard();
    return { ok: true, rounds, shuffled };
  }

  resolve(opts) {
    const N = this.N, rounds = [];
    let combo = 0, first = true;
    for (let guard = 0; guard < 60; guard++) {
      const clear = new Map(), spawns = [], fx = [];
      if (first && opts.forced) { opts.forced.forEach(i => clear.set(i, true)); (opts.fx || []).forEach(f => fx.push(f)); }
      const groups = this.findGroups();
      for (const g of groups) {
        g.cells.forEach(([r, c]) => clear.set(r * N + c, true));
        const sp = this.specialFor(g, first ? opts.swap : null);
        if (sp) spawns.push(sp);
      }
      if (!clear.size) break;
      // cadena de especiales
      const queue = Array.from(clear.keys()), seen = new Set(queue);
      let specialsFired = 0;
      while (queue.length) {
        const i = queue.pop(), r = Math.floor(i / N), c = i % N;
        const g = this.grid[r][c];
        if (!g || !g.sp) continue;
        specialsFired++;
        const add = [];
        if (g.sp === 1) { for (let k = 0; k < N; k++) add.push(r * N + k); fx.push({ kind: "row", r, c }); }
        else if (g.sp === 2) { for (let k = 0; k < N; k++) add.push(k * N + c); fx.push({ kind: "col", r, c }); }
        else if (g.sp === 3) { for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) { if (Math.abs(dr) + Math.abs(dc) > 3) continue; const rr = r + dr, cc = c + dc; if (rr >= 0 && cc >= 0 && rr < N && cc < N) add.push(rr * N + cc); } fx.push({ kind: "bomb", r, c }); }
        else if (g.sp === 4) {
          const count = {};
          for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) { const x = this.grid[rr][cc]; if (x && x.t < 5) count[x.t] = (count[x.t] || 0) + 1; }
          let best = -1, bc = -1; for (const k in count) if (count[k] > bc) { bc = count[k]; best = +k; }
          for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) { const x = this.grid[rr][cc]; if (x && x.t === best) add.push(rr * N + cc); }
          fx.push({ kind: "rainbow", r, c, t: best });
        }
        add.forEach(j => { if (!seen.has(j)) { seen.add(j); clear.set(j, true); queue.push(j); } });
      }
      // recoger
      const clearedList = [], iceHits = [];
      let n = 0;
      clear.forEach((_, i) => {
        const r = Math.floor(i / N), c = i % N, g = this.grid[r][c];
        if (!g) return;
        clearedList.push({ id: g.id, r, c, t: g.t, sp: g.sp });
        n++;
        if (g.t < 5) this.collected[g.t]++;
        if (this.ice[r][c] > 0) { this.ice[r][c]--; this.iceLeft--; iceHits.push({ r, c, left: this.ice[r][c] }); }
        this.grid[r][c] = null;
      });
      this.totalCleared += n;
      const gain = Math.round(n * 10 * (1 + combo * 0.5)) + specialsFired * 40 + spawns.length * 20;
      this.score += gain;
      // especiales nuevos
      const spawned = [];
      spawns.forEach(s => { this.grid[s.r][s.c] = s.gem; spawned.push({ id: s.gem.id, t: s.gem.t, sp: s.gem.sp, r: s.r, c: s.c }); });
      // gravedad + relleno
      const moved = [], created = [];
      for (let c = 0; c < N; c++) {
        let w = N - 1;
        for (let r = N - 1; r >= 0; r--) {
          const g = this.grid[r][c];
          if (g) { if (w !== r) { this.grid[w][c] = g; this.grid[r][c] = null; moved.push({ id: g.id, r: w, c, from: r }); } w--; }
        }
        const missing = w + 1;
        for (let r = w; r >= 0; r--) {
          const g = this.newGem(this.randType());
          this.grid[r][c] = g;
          created.push({ id: g.id, t: g.t, sp: 0, r, c, from: r - missing });
        }
      }
      rounds.push({ cleared: clearedList, fx, spawned, moved, created, gain, combo, iceHits, score: this.score });
      combo++; first = false;
    }
    return rounds;
  }

  shuffleBoard() {
    const N = this.N;
    const gems = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) gems.push(this.grid[r][c]);
    for (let tries = 0; tries < 120; tries++) {
      for (let i = gems.length - 1; i > 0; i--) { const j = Math.floor(this.rand() * (i + 1)); const t = gems[i]; gems[i] = gems[j]; gems[j] = t; }
      gems.forEach((g, i) => { this.grid[Math.floor(i / N)][i % N] = g; });
      if (!this.findGroups().length && this.hasMoves()) break;
      if (tries === 119) {
        gems.forEach((g, i) => { if (g.t < 5 && g.sp === 0) g.t = this.randType(); this.grid[Math.floor(i / N)][i % N] = g; });
        for (let k = 0; k < 40 && (this.findGroups().length || !this.hasMoves()); k++) {
          gems.forEach(g => { if (g.sp === 0) g.t = this.randType(); });
        }
      }
    }
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) out.push({ id: this.grid[r][c].id, r, c });
    return out;
  }

  progress() {
    const goals = (this.cfg.goals || []).map(g => ({ t: g.t, n: g.n, have: Math.min(g.n, this.collected[g.t]) }));
    const done = goals.every(g => g.have >= g.n) && this.iceLeft <= 0 && this.score >= (this.cfg.score || 0);
    return { goals, iceLeft: this.iceLeft, iceTotal: this.cfg.ice ? this.cfg.ice.reduce((a, b) => a + b.h, 0) : 0, score: this.score, target: this.cfg.score || 0, done };
  }
  done() { return this.progress().done; }
}

/* ---------- Bot para calibrar la dificultad (solo pruebas) ---------- */
function botPlay(cfg, rand, mode) {
  const b = new Board(cfg, rand);
  const wantT = new Set((cfg.goals || []).map(g => g.t));
  let guard = 0;
  while (b.moves > 0 && !b.done() && guard++ < 200) {
    const moves = b.listMoves();
    if (!moves.length) { b.shuffleBoard(); continue; }
    let pick;
    if (mode === "random") pick = moves[Math.floor(rand() * moves.length)];
    else {
      let best = -1e9;
      for (const m of moves) {
        const [r, c, r2, c2] = m;
        const a = b.grid[r][c], g2 = b.grid[r2][c2];
        let s = 0;
        if (a.sp === 4 || g2.sp === 4) s += 12; else if (a.sp > 0 && g2.sp > 0) s += 10;
        b.swapCells(r, c, r2, c2);
        for (const g of b.findGroups()) {
          s += g.cells.length * (1 + (wantT.has(g.t) ? 1.2 : 0));
          g.cells.forEach(([rr, cc]) => { if (b.ice[rr][cc] > 0) s += 2.5; });
          const mx = Math.max.apply(null, g.runs.map(x => x.cells.length));
          if (mx >= 4) s += 3; if (mx >= 5) s += 5;
        }
        b.swapCells(r, c, r2, c2);
        s += rand() * 1.5;
        if (s > best) { best = s; pick = m; }
      }
    }
    b.trySwap(pick[0], pick[1], pick[2], pick[3]);
  }
  return { win: b.done(), movesLeft: b.moves, score: b.score, b };
}

function makeCode() { return "SQ1." + btoa(unescape(encodeURIComponent(JSON.stringify({ name: S.name, stars: S.stars })))); }
function readCode(txt) {
  txt = (txt || "").trim();
  if (txt.indexOf("SQ1.") !== 0) throw new Error("formato");
  const o = JSON.parse(decodeURIComponent(escape(atob(txt.slice(4)))));
  const stars = {};
  for (const k in o.stars) { const n = +k, v = +o.stars[k]; if (n >= 1 && n <= MAXLV && v >= 0 && v <= 3) stars[n] = v; }
  return { name: String(o.name || "").slice(0, 18), stars };
}

"use strict";
/* ============================================================
   Interfaz · tablero de cristales
   ============================================================ */
let B = null;
const UI = { busy: false, sel: null, drag: null, byId: {}, cells: [], iceEl: {}, hammer: false, shufUsed: false, extraUsed: false, idleT: null, iceTotal: 0 };
const GCOL = ["#ff4d6d", "#3b9bff", "#2fd07a", "#ff9a1f", "#b36bff", "#ffffff"];

function setPos(el, r, c) { el.style.setProperty("--r", r); el.style.setProperty("--c", c); }
function mkGemEl(g, r, c) {
  const d = document.createElement("div");
  d.className = "gem gx g" + g.t + (g.sp ? " sp" + g.sp : "");
  d.dataset.id = g.id;
  setPos(d, r, c);
  d.innerHTML = '<span class="sh"></span><b>' + (g.t === 5 ? "★" : SMARTLET[g.t]) + "</b>" + (g.sp === 1 ? '<i class="arr">↔</i>' : g.sp === 2 ? '<i class="arr">↕</i>' : g.sp === 3 ? '<i class="arr">✸</i>' : "");
  return d;
}
const snapshot = () => ({ col: B.collected.slice(), score: B.score, ice: B.iceLeft, moves: B.moves });

function startBoard(n) {
  closeModal(true);
  const cfg = levelConfig(n), info = lvInfo(n);
  B = new Board(cfg);
  cur = { s: "board", n, cfg, info };
  setTheme(info.w); Snd.music(info.w, "play");
  UI.busy = false; UI.sel = null; UI.drag = null; UI.hammer = false; UI.shufUsed = false; UI.extraUsed = false;
  UI.iceTotal = cfg.ice.reduce((a, b) => a + b.h, 0);
  setTop({ back: "exitBoard", title: (info.boss ? "Jefe · " : "Nivel ") + n + " · " + WORLDS[info.w].short });
  render('<section><div class="hud"><div class="pill moves" id="pmv"><small>Jugadas</small><b id="mv">0</b></div><div class="pill"><small>Puntos</small><b id="sc">0</b></div></div>' +
    '<div class="goals" id="goals"></div><div class="boardwrap"><div class="board" id="board" style="--n:' + cfg.size + '"><div id="icel"></div><div id="gl"></div><div class="fxl" id="fxl"></div></div></div>' +
    '<div class="boost"><button class="btn small ghost" id="bHam" data-act="hammer">🔨 Martillo ×' + B.hammers + '</button><button class="btn small ghost" id="bShuf" data-act="shuf">🔀 Mezclar</button></div></section>');
  buildBoardDOM();
  hudFrom(snapshot());
  idleReset();
}

function buildBoardDOM() {
  const N = B.N, gl = $("#gl"), ice = $("#icel");
  UI.cells = []; UI.byId = {}; UI.iceEl = {};
  for (let r = 0; r < N; r++) {
    UI.cells.push([]);
    for (let c = 0; c < N; c++) {
      const g = B.grid[r][c], el = mkGemEl(g, r, c);
      gl.appendChild(el); UI.byId[g.id] = el; UI.cells[r].push(el);
    }
  }
  B.cfg.ice.forEach(i => {
    const d = document.createElement("div");
    d.className = "ice" + (i.h > 1 ? " h2" : "");
    setPos(d, i.r, i.c); ice.appendChild(d); UI.iceEl[i.r * N + i.c] = d;
  });
  const bd = $("#board");
  bd.onpointerdown = onDown; bd.onpointermove = onMove; bd.onpointerup = onUp; bd.onpointercancel = onUp;
}

function hudFrom(s) {
  const mv = $("#mv"); if (!mv) return;
  mv.textContent = s.moves; $("#pmv").classList.toggle("low", s.moves <= 5);
  $("#sc").textContent = s.score;
  const cfg = B.cfg; let h = "";
  cfg.goals.forEach(g => { const have = Math.min(g.n, s.col[g.t]); h += '<div class="goal' + (have >= g.n ? " ok" : "") + '">' + gi(g.t) + " " + have + "/" + g.n + "</div>"; });
  if (UI.iceTotal) { const left = Math.max(0, s.ice); h += '<div class="goal' + (left <= 0 ? " ok" : "") + '">❄️ ' + (UI.iceTotal - left) + "/" + UI.iceTotal + "</div>"; }
  if (cfg.score) h += '<div class="goal' + (s.score >= cfg.score ? " ok" : "") + '">⭐ ' + Math.min(s.score, cfg.score) + "/" + cfg.score + "</div>";
  $("#goals").innerHTML = h;
  const hb = $("#bHam"); if (hb) { hb.textContent = "🔨 Martillo ×" + B.hammers; hb.classList.toggle("on", UI.hammer); }
}

/* ---------- entrada ---------- */
function cellFromEvent(e) {
  const rc = $("#board").getBoundingClientRect(), cell = rc.width / B.N;
  const c = Math.floor((e.clientX - rc.left) / cell), r = Math.floor((e.clientY - rc.top) / cell);
  return r < 0 || c < 0 || r >= B.N || c >= B.N ? null : [r, c];
}
function clearSel() { if (UI.sel) { const e = UI.cells[UI.sel[0]] && UI.cells[UI.sel[0]][UI.sel[1]]; if (e) e.classList.remove("sel"); UI.sel = null; } }
function onDown(e) {
  if (UI.busy || !B) return;
  Snd.unlock();
  const p = cellFromEvent(e); if (!p) return;
  idleReset();
  if (UI.hammer) { doHammer(p[0], p[1]); return; }
  if (UI.sel) {
    const sr = UI.sel[0], sc = UI.sel[1];
    if (Math.abs(sr - p[0]) + Math.abs(sc - p[1]) === 1) { attemptSwap(sr, sc, p[0], p[1]); return; }
    if (sr === p[0] && sc === p[1]) { clearSel(); return; }
    clearSel();
  }
  UI.sel = p; UI.cells[p[0]][p[1]].classList.add("sel"); Snd.sfx.select();
  UI.drag = { x: e.clientX, y: e.clientY, r: p[0], c: p[1] };
  try { $("#board").setPointerCapture(e.pointerId); } catch (_) { }
}
function onMove(e) {
  const d = UI.drag; if (!d || UI.busy || !B) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y, th = ($("#board").getBoundingClientRect().width / B.N) * 0.4;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  UI.drag = null;
  let r2 = d.r, c2 = d.c;
  if (Math.abs(dx) > Math.abs(dy)) c2 += dx > 0 ? 1 : -1; else r2 += dy > 0 ? 1 : -1;
  if (r2 < 0 || c2 < 0 || r2 >= B.N || c2 >= B.N) return;
  attemptSwap(d.r, d.c, r2, c2);
}
function onUp() { UI.drag = null; }

/* ---------- jugadas ---------- */
async function attemptSwap(r1, c1, r2, c2) {
  if (UI.busy || !B) return;
  clearSel(); idleReset();
  const e1 = UI.cells[r1][c1], e2 = UI.cells[r2][c2], snap = snapshot();
  UI.busy = true;
  const res = B.trySwap(r1, c1, r2, c2);
  if (!res.ok) {
    setPos(e1, r2, c2); setPos(e2, r1, c1); Snd.sfx.swap();
    await sleep(170);
    setPos(e1, r1, c1); setPos(e2, r2, c2);
    await sleep(190);
    e1.classList.add("shake"); e2.classList.add("shake"); Snd.sfx.bad();
    setTimeout(() => { e1.classList.remove("shake"); e2.classList.remove("shake"); }, 300);
    UI.busy = false; idleReset(); return;
  }
  setPos(e1, r2, c2); setPos(e2, r1, c1); Snd.sfx.swap();
  snap.moves = B.moves; hudFrom(snap);
  await sleep(200);
  await playRounds(res.rounds, snap);
  if (res.shuffled) await playShuffle(res.shuffled);
  resync(); hudFrom(snapshot());
  UI.busy = false;
  afterMove();
}

async function doHammer(r, c) {
  if (B.hammers <= 0) { toast("No quedan martillos"); return; }
  UI.hammer = false; $("#board").classList.remove("hammer");
  UI.busy = true;
  const snap = snapshot();
  const res = B.useHammer(r, c);
  if (!res.ok) { UI.busy = false; return; }
  Snd.sfx.boom();
  await playRounds(res.rounds, snap);
  if (res.shuffled) await playShuffle(res.shuffled);
  resync(); hudFrom(snapshot());
  UI.busy = false;
  afterMove();
}

async function playRounds(rounds, snap) {
  const gl = $("#gl");
  for (const rd of rounds) {
    if (rd.fx.length) rd.fx.forEach(fxAdd); else Snd.sfx.match(rd.combo);
    if (rd.spawned.length) setTimeout(() => Snd.sfx.special(), 120);
    const many = rd.cleared.length > 14;
    rd.cleared.forEach(c => {
      const el = UI.byId[c.id];
      if (el) { el.classList.add("pop"); if (!many || Math.random() < 0.4) burst(c.r, c.c, c.t); }
    });
    rd.iceHits.forEach(hitIce);
    floatPts(rd);
    await sleep(240);
    rd.cleared.forEach(c => { const el = UI.byId[c.id]; if (el) { el.remove(); delete UI.byId[c.id]; } });
    rd.spawned.forEach(s => { const el = mkGemEl(s, s.r, s.c); el.classList.add("spawn"); gl.appendChild(el); UI.byId[s.id] = el; });
    rd.moved.forEach(m => { const el = UI.byId[m.id]; if (el) setPos(el, m.r, m.c); });
    rd.created.forEach(m => { const el = mkGemEl(m, m.from, m.c); gl.appendChild(el); UI.byId[m.id] = el; });
    void gl.offsetWidth;
    rd.created.forEach(m => setPos(UI.byId[m.id], m.r, m.c));
    rd.cleared.forEach(c => { if (c.t < 5) snap.col[c.t]++; });
    snap.score = rd.score; snap.ice -= rd.iceHits.length; hudFrom(snap);
    await sleep(270);
  }
}

function resync() {
  const N = B.N, keep = new Set(), gl = $("#gl");
  const cells = [];
  for (let r = 0; r < N; r++) {
    cells.push([]);
    for (let c = 0; c < N; c++) {
      const g = B.grid[r][c];
      let el = UI.byId[g.id];
      if (!el) { el = mkGemEl(g, r, c); gl.appendChild(el); UI.byId[g.id] = el; }
      setPos(el, r, c); keep.add(String(g.id)); cells[r].push(el);
    }
  }
  UI.cells = cells;
  Array.prototype.slice.call(gl.children).forEach(ch => { if (!keep.has(ch.dataset.id)) { delete UI.byId[ch.dataset.id]; ch.remove(); } });
}
async function playShuffle(list) {
  Snd.sfx.shuffle(); banner("¡Mezclando cristales!");
  list.forEach(x => { const el = UI.byId[x.id]; if (el) setPos(el, x.r, x.c); });
  await sleep(480);
}

/* ---------- efectos ---------- */
function fxAdd(f) {
  const fxl = $("#fxl"); if (!fxl) return;
  const d = document.createElement("div");
  if (f.kind === "row") { d.className = "beam h"; Snd.sfx.zap(); }
  else if (f.kind === "col") { d.className = "beam v"; Snd.sfx.zap(); }
  else if (f.kind === "bomb") { d.className = "ring"; Snd.sfx.boom(); }
  else { d.className = "flash"; Snd.sfx.rainbow(); }
  setPos(d, f.r, f.c); fxl.appendChild(d);
  setTimeout(() => d.remove(), 650);
}
function burst(r, c, t) {
  const fxl = $("#fxl"); if (!fxl) return;
  const cell = $("#board").getBoundingClientRect().width / B.N;
  for (let i = 0; i < 4; i++) {
    const p = document.createElement("div"); p.className = "pt";
    setPos(p, r, c);
    p.style.setProperty("--pc", GCOL[t] || "#fff");
    p.style.setProperty("--dx", ((Math.random() - 0.5) * cell * 1.8).toFixed(0) + "px");
    p.style.setProperty("--dy", ((Math.random() - 0.5) * cell * 1.8).toFixed(0) + "px");
    fxl.appendChild(p); setTimeout(() => p.remove(), 560);
  }
}
function floatPts(rd) {
  const fxl = $("#fxl"); if (!fxl || !rd.cleared.length) return;
  const m = rd.cleared[Math.floor(rd.cleared.length / 2)];
  const d = document.createElement("div"); d.className = "pts"; d.textContent = "+" + rd.gain;
  setPos(d, Math.max(0, Math.min(B.N - 1, m.r - 0.2)), Math.max(0, Math.min(B.N - 2, m.c)));
  fxl.appendChild(d); setTimeout(() => d.remove(), 850);
}
function hitIce(h) {
  const d = UI.iceEl[h.r * B.N + h.c]; if (!d) return;
  Snd.sfx.ice();
  if (h.left <= 0) { d.classList.add("brk"); setTimeout(() => d.remove(), 360); delete UI.iceEl[h.r * B.N + h.c]; }
  else d.classList.remove("h2");
}
function banner(text) {
  const bd = $("#board") || $("#tdf"); if (!bd) return;
  const b = document.createElement("div"); b.className = "banner";
  b.innerHTML = "<span>" + esc(text) + "</span>"; bd.appendChild(b);
  setTimeout(() => b.remove(), 1500);
}

/* ---------- ayudas ---------- */
function idleReset() {
  clearTimeout(UI.idleT);
  document.querySelectorAll(".gem.hintp").forEach(e => e.classList.remove("hintp"));
  if (cur.s === "board") UI.idleT = setTimeout(idleHint, 7000);
}
function idleHint() {
  if (cur.s !== "board" || !B) return;
  if (UI.busy || modalOpen()) { idleReset(); return; }
  const m = B.listMoves(); if (!m.length) return;
  const mv = m[Math.floor(Math.random() * m.length)];
  [UI.cells[mv[0]][mv[1]], UI.cells[mv[2]][mv[3]]].forEach(e => e && e.classList.add("hintp"));
}
function toggleHammer() {
  if (UI.busy || !B) return;
  if (B.hammers <= 0) { toast("Ya usaste el martillo"); return; }
  UI.hammer = !UI.hammer;
  $("#board").classList.toggle("hammer", UI.hammer);
  $("#bHam").classList.toggle("on", UI.hammer);
  if (UI.hammer) toast("Toca el cristal que quieres romper");
}
async function doShuffle() {
  if (UI.busy || !B) return;
  if (UI.shufUsed) { toast("Solo puedes mezclar una vez por nivel"); return; }
  UI.shufUsed = true; UI.busy = true; clearSel();
  const list = B.shuffleBoard();
  await playShuffle(list);
  resync(); UI.busy = false;
}

/* ---------- fin del tablero ---------- */
function afterMove() {
  idleReset();
  if (B.progress().done) boardWin();
  else if (B.moves <= 0) boardLose();
}
async function boardWin() {
  UI.busy = true; clearTimeout(UI.idleT);
  Snd.sfx.win(); banner("¡Cristales completados!");
  await sleep(1400);
  const hints = 1 + Math.min(3, Math.floor(B.totalCleared / 20));
  openModal("<h2>💎 ¡Cristales completados!</h2><p class='sub'>Lo lograste con " + B.moves + " jugadas de sobra.</p>" +
    '<div class="sum"><div><b>' + B.score + '</b><small>puntos</small></div><div><b>' + B.totalCleared + '</b><small>cristales</small></div><div><b>💡 ' + hints + '</b><small>pistas ganadas</small></div></div>' +
    '<div class="zafi">' + ZAFI + '<div class="bubble">¡Ahora viene el <b>reto SMART</b>! Usa tus pistas con cuidado.</div></div>' +
    '<div class="acts"><button class="btn green" data-act="toChallenge">¡Al reto SMART! ▶</button></div>', { dismiss: false });
}
